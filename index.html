    paginateCanvasToPDF(pdf, canvas, cutPoints, margin, usableW, pageHpx, scale);
    pdf.save(`resultados_individuais_5ano${turma}.pdf`);
  } catch(e) {
    if (document.body.contains(wrap)) document.body.removeChild(wrap);
    alert('Erro ao gerar PDF: ' + e.message);
  }
}

/* ═══════════════════════════════ DOWNLOAD PDF DESCRITORES ═══════════════════════════════ */
async function downloadDescritoresPDF(areaKey) {
  const arr = getFiltered(currentDescTab);
  if (!arr.length) { alert('Importe os dados antes de gerar o PDF.'); return; }

  const arrMedia  = alunosMedia(arr);   // estatísticas sem alunos PCD
  const areaLabel = areaKey === 'Port' ? 'Língua Portuguesa' : 'Matemática';
  const hdrColor  = areaKey === 'Port' ? '#0284c7' : '#7c3aed';
  const turmaLabel = currentDescTab === 'ALL' ? 'Geral (A + B)' : `4° Ano ${currentDescTab}`;

  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;top:0;left:-9999px;width:860px;background:#fff;font-family:Segoe UI,system-ui,sans-serif;padding:28px 28px 20px';
  document.body.appendChild(wrap);

  /* ── header ── */
  const header = document.createElement('div');
  header.style.cssText = `display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:3px solid ${hdrColor}`;
  header.innerHTML = `
    <div>
      <div style="font-size:1.1rem;font-weight:800;color:#1e2a3b">📋 % Acerto por Descritor — ${areaLabel}</div>
      <div style="font-size:.78rem;color:#6b7a99;margin-top:3px">${turmaLabel} · ${new Date().toLocaleDateString('pt-BR')}</div>
    </div>`;
  wrap.appendChild(header);

  /* ── clone chart canvas ── */
  const srcCanvas = document.getElementById('cDesc' + areaKey);
  if (srcCanvas) {
    const chartImg = document.createElement('img');
    chartImg.src = srcCanvas.toDataURL('image/png');
    chartImg.style.cssText = 'width:100%;max-height:340px;object-fit:contain;margin-bottom:18px;border:1px solid #e5e7eb;border-radius:8px;padding:8px;background:#fafbfd';
    wrap.appendChild(chartImg);
  }

  /* ── build descriptor table ── */
  const range = areaKey === 'Port' ? [1, PA] : [PA + 1, NQ];
  const descs = {};
  for (let q = range[0]; q <= range[1]; q++) {
    const gabQ = gabarito[`q${q}`] || {};
    const desc = gabQ.desc || 'S/D';
    if (!descs[desc]) descs[desc] = { label: desc, questoes: [], ac: 0, total: 0 };
    descs[desc].questoes.push(q);
    arrMedia.forEach(a => {
      const r = a.respostas[`q${q}`];
      if (r) { descs[desc].total++; if (r.acertou) descs[desc].ac++; }
    });
  }
  const sorted = Object.values(descs).sort((a, b) => a.label.localeCompare(b.label));
  const pcts   = sorted.map(d => d.total ? Math.round(d.ac / d.total * 100) : 0);

  const thS = (txt, align='center') => `<th style="background:#1e2a3b;color:#fff;padding:.4rem .6rem;text-align:${align};font-weight:700;font-size:.72rem;border:1px solid #374151;white-space:nowrap">${txt}</th>`;
  let tbl = `<table style="border-collapse:collapse;font-size:.78rem;font-family:Segoe UI,system-ui,sans-serif;width:100%"><thead><tr>
    ${thS('Descritor','left')}
    ${thS('Questões')}
    ${thS('Acertos')}
    ${thS('Respostas')}
    ${thS('% Acerto')}
    ${thS('Desempenho')}
  </tr></thead><tbody>`;

  sorted.forEach((d, i) => {
    const p = pcts[i];
    const rowBg = i % 2 === 0 ? '#ffffff' : '#f8fafd';
    const barBg = p >= 70 ? '#4ade80' : p >= 50 ? '#facc15' : '#f87171';
    const pBg   = p >= 70 ? '#166534' : p >= 50 ? '#b45309' : '#dc2626';
    tbl += `<tr>
      <td style="padding:.38rem .65rem;border:1px solid #e5e7eb;background:${rowBg};font-weight:700;text-align:left">${esc(d.label)}</td>
      <td style="padding:.38rem .55rem;border:1px solid #e5e7eb;background:${rowBg};text-align:center;color:#6b7a99">${d.questoes.join(', ')}</td>
      <td style="padding:.38rem .55rem;border:1px solid #e5e7eb;background:${rowBg};text-align:center;font-weight:700">${d.ac}</td>
      <td style="padding:.38rem .55rem;border:1px solid #e5e7eb;background:${rowBg};text-align:center">${d.total}</td>
      <td style="padding:.38rem .55rem;border:1px solid #e5e7eb;background:${rowBg};text-align:center"><span style="display:inline-block;padding:.18rem .42rem;border-radius:4px;font-size:.7rem;font-weight:800;background:${pBg};color:#fff">${p}%</span></td>
      <td style="padding:.38rem .65rem;border:1px solid #e5e7eb;background:${rowBg}">
        <div style="background:#e5e7eb;border-radius:4px;height:10px;width:100%">
          <div style="height:10px;border-radius:4px;background:${barBg};width:${p}%"></div>
        </div>
      </td>
    </tr>`;
  });
  tbl += '</tbody></table>';

  const tblDiv = document.createElement('div');
  tblDiv.innerHTML = tbl;
  wrap.appendChild(tblDiv);

  try {
    const canvas = await html2canvas(wrap, { scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff' });
    const canvasScale = canvas.width / wrap.getBoundingClientRect().width;
    const cutPoints   = collectSafeCutPoints(wrap, canvasScale);
    document.body.removeChild(wrap);

    const { jsPDF } = window.jspdf;
    const pdf     = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const margin  = 12;
    const pw      = pdf.internal.pageSize.getWidth();
    const ph      = pdf.internal.pageSize.getHeight();
    const usableW = pw - margin * 2;
    const scale   = usableW / canvas.width;
    const pageHpx = (ph - margin * 2) / scale;

    paginateCanvasToPDF(pdf, canvas, cutPoints, margin, usableW, pageHpx, scale);
    pdf.save(`descritores_${areaKey.toLowerCase()}_${currentDescTab.toLowerCase()}.pdf`);
  } catch(e) {
    if (document.body.contains(wrap)) document.body.removeChild(wrap);
    alert('Erro ao gerar PDF: ' + e.message);
  }
}

/* ═══════════════════════════════ EXPORT CSV ═══════════════════════════════ */
function exportCSV() {
  const all = getFiltered(currentTab);
  if (!all.length) return;
  downloadCSV(all, 'resultados_geral.csv');
}

function exportCSVTurma(turma) {
  const arr = turma === 'A' ? resultadosA : resultadosB;
  if (!arr.length) return;
  downloadCSV(arr, `resultados_4${turma.toLowerCase()}.csv`);
}

function downloadCSV(arr, filename) {
  let csv = 'Número,Nome,Turma,Acertos Port.,% Port.,Nível Port.,Acertos Mat.,% Mat.,Nível Mat.,% Geral,PCD (fora da média)\n';
  arr.sort((a,b)=>b.pctGeral-a.pctGeral).forEach(a => {
    const np = nivelPort(a.pctPort).label;
    const nm = nivelMath(a.pctMath).label;
    csv += `"${a.numero}","${nomeExib(a)}","4°${a.turma}",${a.acPort},${a.pctPort}%,"${np}",${a.acMath},${a.pctMath}%,"${nm}",${a.pctGeral}%,"${isPcd(a) ? 'Sim' : ''}"\n`;
  });
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
}

/* ═══════════════════════════════ PCD (observações) ═══════════════════════════════
   Um aluno com observação preenchida é tratado como PCD:
   • o resultado continua sendo divulgado;
   • o NOME aparece somente no Gabarito Visual (nas outras telas fica anônimo);
   • a nota NÃO entra no cálculo das médias/estatísticas da turma.            */
function pcdKey(a) { return `${String(a.numero||'').trim()}|${String(a.nome||'').trim()}`; }
function getObsPcd(a) {
  const m = obsPcd[a.turma] || {};
  return (m[pcdKey(a)] || '').trim();
}
function isPcd(a) { return getObsPcd(a) !== ''; }
/* alunos considerados no cálculo das médias (exclui PCD) */
function alunosMedia(arr) { return arr.filter(a => !isPcd(a)); }
/* nome exibido fora do Gabarito Visual */
function nomeExib(a) {
  if (!isPcd(a)) return a.nome;
  return 'Aluno(a) PCD' + (a.numero ? ' — Nº ' + String(a.numero).trim() : '');
}
function persistObsPcd() {
  localStorage.setItem(K('obsPcd'), JSON.stringify(obsPcd));
  if (db) db.ref(FB('obsPcd')).set(obsPcd).catch(() => {});
}
function renderPcdPanel(turma) {
  const arr = turma === 'A' ? resultadosA : resultadosB;
  const el  = document.getElementById('pcd-' + turma.toLowerCase());
  if (!el) return;
  if (!arr.length) { el.innerHTML = '<p class="muted tc" style="padding:1.5rem">Sem dados.</p>'; return; }
  const sorted = [...arr].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  let h = `<div class="alert a-info">🧩 Escreva uma observação para os alunos PCD. Quem tiver observação continua com o <strong>resultado divulgado</strong>, mas o <strong>nome aparece apenas no Gabarito Visual</strong> e a nota <strong>não entra no cálculo da média da turma</strong>. Deixe em branco para remover.</div>
  <div class="tbl-wrap"><table><thead><tr><th>Nº</th><th>Nome</th><th>Observação (PCD)</th></tr></thead><tbody>`;
  sorted.forEach(a => {
    h += `<tr>
      <td class="muted">${esc(a.numero)}</td>
      <td><strong>${esc(a.nome)}</strong>${isPcd(a) ? ' <span class="tag tag-b">PCD</span>' : ''}</td>
      <td><input type="text" class="pcd-input" data-key="${esc(pcdKey(a))}" value="${esc(getObsPcd(a))}" placeholder="Ex.: aluno PCD — laudo TEA, avaliação adaptada" /></td>
    </tr>`;
  });
  h += `</tbody></table></div>
  <div class="btns mt2"><button class="btn btn-success btn-sm" onclick="saveObsPcd('${turma}')">💾 Salvar observações</button></div>`;
  el.innerHTML = h;
}
function saveObsPcd(turma) {
  const el = document.getElementById('pcd-' + turma.toLowerCase());
  if (!el) return;
  const map = {};
  el.querySelectorAll('.pcd-input').forEach(inp => {
    const v = inp.value.trim();
    if (v) map[inp.dataset.key] = v;
  });
  obsPcd[turma] = map;
  persistObsPcd();
  const n = Object.keys(map).length;
  msg('pcd-msg-' + turma.toLowerCase(), `✅ Observações salvas. ${n} aluno(s) marcados como PCD — nome oculto fora do Gabarito Visual e nota fora das médias.`, 'a-ok');
  renderTurmaPage(turma);
  renderDashboard();
  renderDescritores();
  showSubTab(turma, 'pcd');
}

/* ═══════════════════════════════ NÍVEIS ═══════════════════════════════ */
function nivelPort(p) {
  if (p >= 85) return { label: 'ADEQUADO',      bg: '#dcfce7', color: '#166534' };
  if (p >= 60) return { label: 'INTERMEDIÁRIO', bg: '#dbeafe', color: '#1e40af' };
  if (p >= 40) return { label: 'CRÍTICO',       bg: '#fef9c3', color: '#854d0e' };
  return              { label: 'MUITO CRÍTICO', bg: '#fee2e2', color: '#991b1b' };
}
function nivelMath(p) {
  if (p >= 80) return { label: 'ADEQUADO',      bg: '#dcfce7', color: '#166534' };
  if (p >= 56) return { label: 'INTERMEDIÁRIO', bg: '#dbeafe', color: '#1e40af' };
  if (p >= 35) return { label: 'CRÍTICO',       bg: '#fef9c3', color: '#854d0e' };
  return              { label: 'MUITO CRÍTICO', bg: '#fee2e2', color: '#991b1b' };
}
function nvBadge(nv) {
  return `<span style="display:inline-block;padding:.18rem .55rem;border-radius:5px;font-size:.7rem;font-weight:700;background:${nv.bg};color:${nv.color}">${nv.label}</span>`;
}

/* ═══════════════════════════════ HELPERS ═══════════════════════════════ */
function gv(id) { return (document.getElementById(id)?.value||'').trim(); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pct(a,b) { return b ? Math.round(a/b*100) : 0; }

function msg(id, text, cls) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = `<div class="alert ${cls}">${text}</div>`;
  if (!text.includes('spinner')) setTimeout(() => el.innerHTML='', 7000);
}

function mkChart(id, type, data, options) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
  charts[id] = new Chart(document.getElementById(id), {type, data, options});
}

function ensureGabarito() {
  if (Object.keys(gabarito).length) return;
  const local = localStorage.getItem(K('gabarito'));
  if (local) gabarito = JSON.parse(local);
}


/* ═══════════════════════════════ TEXTOS DEPENDENTES DO MODO ═══════════════════════════════ */
function applyModeLabels() {
  const root = document.querySelector('.legacy-app');
  if (!root) return;
  root.querySelectorAll('[data-mode-text]').forEach(el => {
    el.textContent = el.dataset.modeText
      .replace(/{{NQ}}/g, String(NQ))
      .replace(/{{PA}}/g, String(PA))
      .replace(/{{PA1}}/g, String(PA + 1));
  });

/* ═══════════════════════════════ INIT ═══════════════════════════════ */
function initLegacyApp(modeId) {
  const mode = MODES[modeId] || MODES['44'];
  MODE_ID = mode.id;
  NQ = mode.nq;
  PA = mode.perArea;

  /* estado limpo a cada troca de modo */
  gabarito = {};
  resultadosA = [];
  resultadosB = [];
  obsPcd = { A: {}, B: {} };
  Object.keys(charts).forEach(id => { try { charts[id].destroy(); } catch (e) {} delete charts[id]; });

  applyModeLabels();
  navBound = false;
  bindNav();
  buildGabaritoGrid();

  const lg = localStorage.getItem(K('gabarito'));
  if (lg) { try { gabarito = JSON.parse(lg); fillGabaritoForm(gabarito); } catch (e) {} }

  const la = localStorage.getItem(K('resultadosA'));
  const lb = localStorage.getItem(K('resultadosB'));
  if (la) { try { resultadosA = JSON.parse(la); } catch (e) {} }
  if (lb) { try { resultadosB = JSON.parse(lb); } catch (e) {} }

  const lo = localStorage.getItem(K('obsPcd'));
  if (lo) { try { obsPcd = Object.assign({ A: {}, B: {} }, JSON.parse(lo)); } catch (e) {} }

  connectFirebase();

  if (db) {
    /* Ouvintes em tempo real: qualquer alteração no Firebase atualiza a tela sem recarregar */
    db.ref(FB('obsPcd')).on('value', snap => {
      obsPcd = Object.assign({ A: {}, B: {} }, snap.val() || {});
      localStorage.setItem(K('obsPcd'), JSON.stringify(obsPcd));
      rerenderCurrent();
    }, () => {});
    ['A', 'B'].forEach(t => {
      db.ref(FB('resultados' + t)).on('value', snap => {
        const v = snap.val();
        const arr = Array.isArray(v) ? v : Object.values(v || {});
        if (t === 'A') resultadosA = arr; else resultadosB = arr;
        if (arr.length) localStorage.setItem(K('resultados' + t), JSON.stringify(arr));
        else localStorage.removeItem(K('resultados' + t));
        updateImportBadges();
        rerenderCurrent();
      }, () => {});
    });
    db.ref(FB('gabarito')).on('value', snap => {
      if (!snap.exists()) return;
      gabarito = snap.val();
      fillGabaritoForm(gabarito);
      localStorage.setItem(K('gabarito'), JSON.stringify(gabarito));
      rerenderCurrent();
    }, () => {});
  }

  updateImportBadges();
  selectTurmaImport('A');
  showTab('gabarito');
  exposeGlobals();
}

function rerenderCurrent() {
  const active = document.querySelector('.legacy-app nav button.active');
  const t = active ? active.dataset.tab : 'gabarito';
  if (t === 'dashboard') renderDashboard();
  if (t === 'turmaA') renderTurmaPage('A');
  if (t === 'turmaB') renderTurmaPage('B');
  if (t === 'descritores') renderDescritores();
}

function showTab(tab) {
  const root = document.querySelector('.legacy-app');
  if (!root) return;
  root.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  root.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === 'sec-' + tab));
  if (tab === 'dashboard') renderDashboard();
  if (tab === 'turmaA') renderTurmaPage('A');
  if (tab === 'turmaB') renderTurmaPage('B');
  if (tab === 'descritores') renderDescritores();
}

/* funções chamadas por atributos onclick da marcação original */
function exposeGlobals() {
  Object.assign(window, {
    saveGabarito, loadGabaritoFromStorage, clearTurma, selectTurmaImport, handleFile,
    showSubTab, setDescTab, saveObsPcd, exportCSV, exportCSVTurma,
    downloadRankingPDF, downloadIndividualPDF, downloadGabaritoVisualPDF, downloadDescritoresPDF,
  });
}

/* ═══════════════ BOOT (arquivo único) ═══════════════ */
const jsPDF = window.jspdf.jsPDF;
const MODE_LIST = [MODES['30'], MODES['44']];
const MARKUP = document.getElementById('legacy-markup').textContent;

function renderMarkup(mode) {
  return MARKUP.replace(/\{\{NQ\}\}/g, String(mode.nq))
    .replace(/\{\{PA1\}\}/g, String(mode.perArea + 1))
    .replace(/\{\{PA\}\}/g, String(mode.perArea));

function selectMode(id) {
  const mode = MODES[id] || MODES['44'];
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode.id));
  document.getElementById('app-root').innerHTML = renderMarkup(mode);
  initLegacyApp(mode.id);
}

document.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', () => selectMode(b.dataset.mode)));
selectMode('44');

let _jsPdfP=null;
function ensureJsPdf(){ if(window.jspdf) return Promise.resolve();
  if(_jsPdfP) return _jsPdfP;
  const srcs=['https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js','https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'];
  _jsPdfP=new Promise((res,rej)=>{
    const trySrc=i=>{ if(i>=srcs.length){_jsPdfP=null; rej(new Error('sem conexão para a biblioteca de PDF')); return;}
      const sc=document.createElement('script'); sc.src=srcs[i]; sc.async=true;
      sc.onload=()=>window.jspdf?res():trySrc(i+1);
      sc.onerror=()=>trySrc(i+1);
      document.head.appendChild(sc); };
    trySrc(0); });
  return _jsPdfP; }
function inIframe(){ try{ return window.top!==window.self; }catch(e){ return true; } }
function deliverPdf(doc,fname){
  let blob,url;
  try{ blob=doc.output('blob'); url=URL.createObjectURL(blob); }
  catch(e){ toast('PDF indisponível — tente novamente','err'); return; }
  try{ const a=document.createElement('a'); a.href=url; a.download=fname; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove(); toast('Folha de gabarito baixada em PDF'); }catch(e){}
  if(inIframe()){ try{ window.open(url,'_blank'); }catch(e){} }
  setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} },240000);
}

function gerarPdf(g){
  if(!g.itens||!g.itens.length){ toast('Adicione ao menos 1 quest\u00e3o','err'); return; }
  if(!window.jspdf){ toast('Carregando biblioteca de PDF\u2026','abl');
    ensureJsPdf().then(()=>gerarPdf(g)).catch(e=>toast('N\u00e3o consegui carregar o gerador de PDF ('+e.message+')','err')); return; }
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
  const Q=g.itens.length, maxIt=Math.max(...g.itens);
  const PITCH=PD.PITCH, COL=PD.COL;                    // 6mm entre linhas, 7mm por item
  const cellW=COL;
  const r=PD.BR;                                       // c\u00edrculo \u00d8 3,8 mm (padr\u00e3o cart\u00e3o-resposta)
  const pages=[]; for(let i=0;i<Q;i+=MAXROWS(g)) pages.push([i,Math.min(Q,i+MAXROWS(g))]);
  pages.forEach((pr,pi)=>{
    if(pi>0)doc.addPage();
    const rows=pr[1]-pr[0], L=gridLayout(rows,maxIt);
    /* c\u00e9lula — todo texto acima da faixa livre das marcas (YT\u22127) */
    doc.setTextColor(24,28,34); doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
    doc.text(String(g.escola||'Escola').toUpperCase().slice(0,58),14,12.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(30,36,44);
    doc.setFillColor(255,197,61); doc.rect(14,14.6,3,3,'F');
    doc.text('FOLHA DE RESPOSTAS \u2014 '+String(g.nome).slice(0,52),19,17.2);
    doc.setTextColor(125,134,145); doc.setFontSize(6.8);
    doc.text(`${Q} quest\u00f5es \u00b7 ${maxIt} itens`+(pages.length>1?` \u00b7 p\u00e1gina ${pi+1} de ${pages.length} (quest\u00f5es ${pr[0]+1}\u2013${pr[1]})`:' \u00b7 impress\u00e3o A4')
      +' \u00b7 preencha 1 \u00fanico c\u00edrculo por quest\u00e3o com caneta azul ou preta',19,21.2);
    doc.setDrawColor(80,88,98); doc.setLineWidth(.4); doc.line(14,23.5,196,23.5);
    doc.setTextColor(35,40,47); doc.setFontSize(8.5);
    doc.text('Nome: ________________________________________________________________________',14,29.5);
    doc.text('Turma: ______________',14,35.5); doc.text('Data: ____ / ____ / ______',66,35.5); doc.text('C\u00f3digo: __________',120,35.5);
    /* marcas de registro (bra\u00e7os de 4 mm) — na faixa 45\u201352, sem texto por perto */
    /* 4 marcas fiduciais: quadrados pretos s\u00f3lidos (leitura autom\u00e1tica pela c\u00e2mera) */
    doc.setFillColor(0,0,0);
    fidMM(rows,maxIt).forEach(([fx,fy])=>doc.rect(fx-PD.FS/2,fy-PD.FS/2,PD.FS,PD.FS,'F'));
    /* letras dos itens no topo da grelha */
    doc.setFont('helvetica','bold'); doc.setFontSize(6); doc.setTextColor(90,99,110);
    for(let c=0;c<L.nCols;c++) for(let i=0;i<maxIt;i++) doc.text(itemLabel(i),colX(c,L)+(i+.5)*cellW,PD.YT-1.2,{align:'center'});
    /* grelha: n\u00famero \u00e0 esquerda da coluna, bolinha com letra dentro */
    for(let q=pr[0];q<pr[1];q++){
      const rowIdx=q-pr[0], [x0,cy]=bubbleMM(rowIdx,0,maxIt,rows), cxL=x0-.5*cellW;
      doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(40,46,54);
      doc.text(String(q+1).padStart(2,'0'),cxL-0.6,cy+0.9,{align:'right'});
      const n=g.itens[q];
      for(let i=0;i<n;i++){
        const cx=cxL+(i+.5)*cellW;
        doc.setDrawColor(70,78,88); doc.setLineWidth(.25); doc.circle(cx,cy,r,'S');
        doc.setFont('helvetica','normal'); doc.setFontSize(5); doc.setTextColor(185,191,198);
        doc.text(itemLabel(i),cx,cy+0.62,{align:'center'});
      }
    }
    doc.setFontSize(6.2); doc.setTextColor(150,158,168);
    doc.text('Corre\u00e7\u00e3o por c\u00e2mera: mantenha os 4 quadrados pretos vis\u00edveis, limpos e sem dobras. Preencha a bolha por completo.',14,292);
    if(pages.length>1){ doc.text(`p\u00e1gina ${pi+1}/${pages.length}`,196,292,{align:'right'}); }
  });
  const fname=`folha-gabarito_${(g.escola||'escola').replace(/[^\w]+/g,'-').toLowerCase()}_${(g.nome||'gabarito').replace(/[^\w]+/g,'-').toLowerCase()}.pdf`;
  deliverPdf(doc,fname);
}

function scCam(st,ft){

  .then(stream=>{ if(!SCAN.active||SCAN.step!=='cam'){stream.getTracks().forEach(t=>t.stop());return;}

function scLiveLoop(video,ov){
  const token={}; SCAN.live=token; let hist=[], busy=false;

  const tick=()=>{

    if(!video.videoWidth||busy){ setTimeout(tick,150); return; }

    const c=document.createElement('canvas'); c.width=W; c.height=H; c.getContext('2d').drawImage(video,0,0,W,H);
    const f=findFiducials(c,rows,mxI);
    ov.width=W; ov.height=H; const cx=ov.getContext('2d'); cx.clearRect(0,0,W,H);
    const hint=$('#sc-live');
    if(f){
      hist.push(f); if(hist.length>5)hist.shift();
      const mv=hist.length>1?Math.max(...f.map((p,i)=>Math.hypot(p[0]-hist[hist.length-2][i][0],p[1]-hist[hist.length-2][i][1]))):1;
      const stable=hist.length>=4&&hist.slice(-4).every((h,k,a)=>!k||Math.max(...h.map((p,i)=>Math.hypot(p[0]-a[k-1][i][0],p[1]-a[k-1][i][1])))<0.012);
      const span=Math.min(Math.hypot(f[1][0]-f[0][0],f[1][1]-f[0][1]),Math.hypot(f[3][1]-f[0][1],f[3][0]-f[0][0]));
      const small=span<0.35;
      cx.lineWidth=3; cx.strokeStyle=stable&&!small?'#3ECF8E':'#FFC53D'; cx.beginPath();
      f.forEach((p,i)=>{ const x=p[0]*W,y=p[1]*H; i?cx.lineTo(x,y):cx.moveTo(x,y); }); cx.closePath(); cx.stroke();
      f.forEach(p=>{ cx.beginPath(); cx.arc(p[0]*W,p[1]*H,9,0,7); cx.stroke(); });
      if(hint) hint.innerHTML=small?'Aproxime o celular — a grelha está pequena demais'
        :(stable?'<b style="color:#3ECF8E">Travado</b> — capturando…':'Marcas encontradas — segure firme, paralelo à folha');
      const auto=$('#sc-auto'); if(stable&&!small&&mv<0.012&&auto&&auto.checked){ busy=true; scShoot(true).finally(()=>{busy=false; hist=[];}); }

async function scShoot(auto){
  if(SCAN.camErr){ $('#sc-file').click(); return; }
  const v=SCAN.video; if(!v||!v.videoWidth){ toast('Aguarde a câmera preparar o vídeo','abl'); return; }
  const frames=[]; for(let k=0;k<3;k++){ frames.push(grabFrame(v)); await new Promise(r=>setTimeout(r,90)); }
  let best=frames[0],bs=-1; for(const f of frames){ const s=sharpness(f); if(s>bs){bs=s;best=f;} }
  const g=SCAN.gab, f=findFiducials(best,rowsOnPage(g,SCAN.page),Math.max(...g.itens));
  if(auto&&!f) return;                                       // perdeu o enquadramento: continua ao vivo
  SCAN.orientationManual=false; SCAN.live=null; SCAN.src=best; SCAN.camErr=false; SCAN.quad=null; SCAN.quadPage=null;
  if(f){ SCAN.quad=f; SCAN.quadPage=SCAN.page; if(navigator.vibrate)try{navigator.vibrate(60);}catch(e){}

    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    SCAN.orientationManual=false; SCAN.live=null; SCAN.src=c; SCAN.quad=null; SCAN.quadPage=null; scGoto('crop'); URL.revokeObjectURL(img.src); };

  const {g,w,h}=grayOf(c);
  const samp=(u,v)=>{ const [x,y]=hApply(H,u,v); if(x<0||y<0||x>=w-1||y>=h-1) return 255;
    const xi=x|0, yi=y|0, fx=x-xi, fy=y-yi, i=yi*w+xi;
    return (g[i]*(1-fx)+g[i+1]*fx)*(1-fy)+(g[i+w]*(1-fx)+g[i+w+1]*fx)*fy; };
  // escala px/mm para densidade de amostragem
  const [ax,ay]=hApply(H,src[0][0],src[0][1]),[bx,by]=hApply(H,src[1][0],src[1][1]);
  const pxmm=Math.hypot(bx-ax,by-ay)/(src[1][0]-src[0][0]);
  const step=Math.max(0.12,Math.min(0.35,1/pxmm));            // ~1 amostra por pixel
  const disc=(rad)=>{ const pts=[]; for(let y=-rad;y<=rad;y+=step)for(let x=-rad;x<=rad;x+=step) if(x*x+y*y<=rad*rad)pts.push([x,y]); return pts; };
  const ring=(r1_,r2_)=>{ const pts=[]; for(let y=-r2_;y<=r2_;y+=step)for(let x=-r2_;x<=r2_;x+=step){ const d=x*x+y*y; if(d>=r1_*r1_&&d<=r2_*r2_)pts.push([x,y]); } return pts; };
  const BR=PD.BR, Pall=disc(BR+0.25), Pin=disc(BR*0.62), Pbg=ring(BR+0.9,BR+1.4);
  const mean=(u,v,P)=>{ let s=0; for(const [x,y] of P) s+=samp(u+x,v+y); return s/P.length; };
  /* 1) calibração fina: deslocamento por linha que alinha os círculos impressos */
  const offs=[]; const SR=0.9, SS=0.15;
  for(let q=0;q<rows;q++){ const n=itens[q+r0]; const cand=[];
    for(let i=0;i<n;i++){ const [u,v]=bubbleMM(q,i,maxIt,rows); let bd=1e9,bo=[0,0];
      for(let dy=-SR;dy<=SR+1e-6;dy+=SS)for(let dx=-SR;dx<=SR+1e-6;dx+=SS){
        const m=mean(u+dx,v+dy,Pall)+(dx*dx+dy*dy)*6;     // leve preferência pelo centro teórico
        if(m<bd){bd=m;bo=[dx,dy];} }
      cand.push(bo); }
    offs.push([median(cand.map(o=>o[0])),median(cand.map(o=>o[1]))]); }
  // suaviza deslocamentos entre linhas vizinhas (papel não dobra de linha a linha)
  const per=gridLayout(rows,maxIt).per, col=q=>Math.floor(q/per);
  const sm=offs.map((o,q)=>{ const a=(q>0&&col(q-1)===col(q))?offs[q-1]:o, b=(q<rows-1&&col(q+1)===col(q))?offs[q+1]:o;
    return [median([a[0],o[0],b[0]]),median([a[1],o[1],b[1]])]; });
  /* 2) medição: escuridão do miolo relativa ao papel ao redor */
  const fills=[],centers=[],all=[];
  for(let q=0;q<rows;q++){ fills[q]=[]; centers[q]=[]; const n=itens[q+r0];
    for(let i=0;i<n;i++){ const [u0,v0]=bubbleMM(q,i,maxIt,rows), u=u0+sm[q][0], v=v0+sm[q][1];
      const inner=mean(u,v,Pin), bg=Math.max(60,mean(u,v,Pbg));
      const f=Math.max(0,Math.min(1,(bg-inner)/bg));
      fills[q][i]=f; centers[q][i]=[u,v]; all.push(f); } }
  /* 3) limiar adaptativo: separa vazio x preenchido */
  const base=median(all);
  const arr=Uint8Array.from(all,f=>Math.min(255,f*255|0)); const ot=otsu(arr)/255;
  let thr=Math.max(base+0.16, Math.min(ot, base+0.35)); if(thr<0.2) thr=0.2;
  const marks=[],unc=[];
  for(let q=0;q<rows;q++){ const row=fills[q], mx=Math.max(...row);
    const cut=Math.max(thr, mx*0.6);                          // ignora resíduo de borracha perto de marca forte
    marks[q]=row.map((f,i)=>f>=cut?i:-2);
    unc[q]=row.some(f=>Math.abs(f-thr)<0.07) || (mx>=thr && row.filter(f=>f>=cut).length>1); }
  return {fills,marks,thr,base,maxIt,centers,unc,H,rows};
}

/* imagem endireitada (para exibição e miniatura) */
function rectify(c,H,rows,maxIt){
  const f=fidMM(rows,maxIt), pad=PD.FS;
  const u0=f[0][0]-pad, v0=f[0][1]-pad, u1=f[2][0]+pad, v1=f[2][1]+pad;
  const S=Math.min(10, 900/(u1-u0));
  const W=Math.round((u1-u0)*S), Hh=Math.round((v1-v0)*S);
  const sd=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c.width,c.height).data;
  const out=new ImageData(W,Hh), od=out.data, w=c.width, h=c.height;
  for(let y=0;y<Hh;y++)for(let x=0;x<W;x++){ const [px,py]=hApply(H,u0+(x+.5)/S,v0+(y+.5)/S);
    const xi=Math.min(w-1,Math.max(0,px|0)), yi=Math.min(h-1,Math.max(0,py|0)), si=(yi*w+xi)*4, di=(y*W+x)*4;
    od[di]=sd[si];od[di+1]=sd[si+1];od[di+2]=sd[si+2];od[di+3]=255; }
  const cv=document.createElement('canvas'); cv.width=W; cv.height=Hh; cv.getContext('2d').putImageData(out,0,0);
  return {cv,map:(u,v)=>[(u-u0)*S,(v-v0)*S],S};
}
function evalMarks(marks,gab,r0){
  const st=[];
  for(let q=0;q<marks.length;q++){ const gq=gab.corretas[q+r0];
    const marked=marks[q].filter(v=>v>=0);
    if(!marked.length){ st.push('branco'); continue; }
    if(marked.length===1&&marked[0]===gq) st.push('ok'); else st.push('err'); }
  return st; }
function markList(mrow){ const out=[]; for(const v of mrow) if(v>=0) out.push(v); return out; }

/* ---- analysis run ---- */
async function runDetect(){
  SCAN.res=null;
  try{
    await new Promise(r=>setTimeout(r,60));
    const g=SCAN.gab, Q=g.itens.length;
    const nPages=Math.ceil(Q/MAXROWS(g));
    const pg=Math.min(SCAN.page||0,nPages-1);
    const r0=pg*MAXROWS(g), r1=Math.min(Q,r0+MAXROWS(g));
    if(!SCAN.orientationManual){
      const orientation=orientByQuestionNumbers(SCAN.src,SCAN.quad,r1-r0,Math.max(...g.itens),r0);
      if(!orientation.confident){
        toast('Não consegui confirmar a numeração. Refaça a foto mais perto ou ajuste o topo ↖ para o lado das primeiras questões usando Girar 180°.','abl');
        scGoto('crop');return;
      }
      SCAN.quad=orientation.quad;
    }
    const d=readSheet(SCAN.src,SCAN.quad,g.itens,r0,r1);
    const wp=rectify(SCAN.src,d.H,d.rows,d.maxIt);
    SCAN.res={wp,d,r0,r1,pg,nPages};
    await new Promise(r=>requestAnimationFrame(r));
    scGoto('res');
    const nu=d.unc.filter(Boolean).length;
    if(nu) toast(`${nu} questão(ões) com leitura incerta — confira as marcadas com borda amarela`,'abl');
  }catch(err){ console.warn(err); toast('Falha ao analisar a imagem — ajuste os 4 pontos sobre os quadrados pretos','err'); scGoto('crop'); }
}
/* ---- step 3: spinner ---- */
function scAna(st,ft){
  st.innerHTML=`<div class="analyzing"><div class="an-ring"></div>
    <div class="an-sheet" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <span>Lendo ${SCAN.gab.itens.length} questões da folha…</span></div>`;
  ft.innerHTML=`<span style="margin:0 auto;color:var(--dim);font-size:12px" class="mono">endireitando · segmentando · comparando gabarito</span>`;
}
/* ---- step 4: result ---- */
function resStatuses(){ const {d,r0}=SCAN.res; const single=d.marks.map(row=>markList(row).length?Math.min(...markList(row)):-1);
  const st=single.map((m,q)=>{ if(m<0)return 'branco'; return m===SCAN.gab.corretas[q+r0]?'ok':'err'; });
  return {single,st}; }
function scRes(st,ft){
  const R=SCAN.res,{single,st:sStat}=resStatuses();
  const {r0,r1,pg,nPages}=R;
  const counts=sStat.reduce((a,s)=>{a[s]++;return a;},{ok:0,err:0,branco:0});
  st.innerHTML=`<div class="sc-result" style="padding:12px;width:100%;max-width:660px;align-self:start">
    <div class="sc-imgwrap"><canvas id="res-cv"></canvas></div>
    <div class="sc-side">
      <div class="score-big"><b id="res-n">${counts.ok}</b><small>de ${sStat.length} questões desta página · ${counts.err} erradas · ${counts.branco} em branco</small></div>
      ${nPages>1?`<div class="pill mut" style="align-self:flex-start">página ${pg+1}/${nPages} · questões ${r0+1}–${r1}</div>`:''}
      <div class="qmark-grid" id="res-qm"></div>
      <details id="adj-box" style="margin-top:2px">
        <summary style="font-size:12px;color:var(--mut);cursor:pointer">Ajustar marcações manualmente (se a leitura errou)</summary>
        <div class="matrix dots-bg matrix-scroll" id="res-mx" style="margin-top:8px;padding:10px;border:1px solid var(--line-soft);border-radius:10px;background:var(--panel)"></div>
      </details>
    </div>
  </div>`;
  drawResImg(single); drawQmarks(single,sStat); drawMatrix(single);
  $('#res-mx').addEventListener('click',e=>{ const b=e.target.closest('.bub'); if(!b)return;
    const q=+b.dataset.q,i=+b.dataset.i;
    single[q]=(single[q]===i)?-1:i;
    R.d.marks[q]=Array.from({length:SCAN.gab.itens[q+r0]},(_,k)=>k===single[q]?k:-2);
    const s2=single.map((m,q2)=>m<0?'branco':(m===SCAN.gab.corretas[q2+r0]?'ok':'err'));
    const c2=s2.reduce((a,x)=>{a[x]++;return a;},{ok:0,err:0,branco:0});
    $('#res-n').textContent=c2.ok; $('#res-n').closest('.score-big').querySelector('small').textContent=
      `de ${s2.length} questões desta página · ${c2.err} erradas · ${c2.branco} em branco`;
    drawResImg(single); drawQmarks(single,s2); drawMatrix(single);
  });
  const hasNext=R.pg<R.nPages-1;
  ft.innerHTML=`
    <button class="btn btn-sm btn-err" id="rs-del">${ICON.trash} Excluir</button>
    <button class="btn btn-sm" id="rs-again">${ICON.redo} Refazer foto</button>
    <button class="btn btn-sm btn-ghost" id="rs-adj">Ajustar pontos</button>
    <span class="spacer"></span>
    <button class="btn btn-cap" id="rs-save">${ICON.save} ${hasNext?`Salvar pág. ${R.pg+1} e próxima →`:'Salvar leitura'}</button>`;
  $('#rs-again').addEventListener('click',()=>scGoto('cam'));
  $('#rs-adj').addEventListener('click',()=>scGoto('crop'));
  $('#rs-del').addEventListener('click',()=>{ if(HOST.del(SCAN.alunoId)){ SCAN.stopStream(); closeModal(); } });
  $('#rs-save').addEventListener('click',()=>{
    const okSave=saveLeitura(single);
    if(!okSave)return;
    if(hasNext){ toast(`Página ${R.pg+1} salva para ${SCAN.alunoNm}`); SCAN.page=R.pg+1; scGoto('cam'); }
    else { toast(`Leitura de ${SCAN.alunoNm} salva`); SCAN.stopStream(); closeModal(); } });
}
function saveLeitura(single){
  const R=SCAN.res;
  const st=single.map((m,q)=>m<0?'branco':(m===SCAN.gab.corretas[q+R.r0]?'ok':'err'));
  const counts=st.reduce((a,s)=>{a[s]++;return a;},{ok:0,err:0,branco:0});
  let thumb=null;
  try{ const t=document.createElement('canvas'); const s2=320/R.wp.cv.width;
    t.width=320;t.height=Math.round(R.wp.cv.height*s2);
    t.getContext('2d').drawImage(resOverlay(single),0,0,t.width,t.height);
    thumb=t.toDataURL('image/jpeg',0.62); }catch(e){ }
  return HOST.save(SCAN.alunoId,single,st,thumb);
}
function resOverlay(single){
  const R=SCAN.res, g=SCAN.gab, cv=R.wp.cv, {centers,unc}=R.d, map=R.wp.map;
  const out=document.createElement('canvas'); out.width=cv.width; out.height=cv.height;
  const cx=out.getContext('2d'); cx.drawImage(cv,0,0);
  const {r0,r1}=R; const Q=r1-r0; const r=PD.BR*R.wp.S*1.08;
  cx.lineWidth=Math.max(1.5,r*0.22);
  for(let q=0;q<Q;q++){ const m=single[q];
    for(let i=0;i<g.itens[q+r0];i++){ const [cxx,cyy]=map(centers[q][i][0],centers[q][i][1]);
      const isMark=m===i, isCorr=g.corretas[q+r0]===i;
      if(isMark&&isCorr){ cx.fillStyle='rgba(62,207,142,.6)'; cx.beginPath();cx.arc(cxx,cyy,r,0,7);cx.fill(); ring(cx,cxx,cyy,r,'#3ECF8E'); }
      else if(isMark){ cx.fillStyle='rgba(244,96,91,.6)';cx.beginPath();cx.arc(cxx,cyy,r,0,7);cx.fill(); ring(cx,cxx,cyy,r,'#F4605B'); }
      else if(isCorr){ ring(cx,cxx,cyy,r*1.25,m<0?'#FFC53D':'rgba(62,207,142,.9)'); }
    }
    if(unc&&unc[q]){ const [ax,ay]=map(centers[q][0][0]-PD.COL*0.55,centers[q][0][1]);
      cx.fillStyle='#FFC53D'; cx.beginPath(); cx.arc(ax-r*0.6,ay,r*0.45,0,7); cx.fill(); }
  }
  return out;
}
function ring(cx,x,y,rr,col){ cx.strokeStyle=col;cx.lineWidth=Math.max(1.5,rr*0.2);cx.beginPath();cx.arc(x,y,rr,0,7);cx.stroke(); }
function drawResImg(single){ const cv=$('#res-cv'); const img=resOverlay(single);
  cv.width=img.width;cv.height=img.height; cv.getContext('2d').drawImage(img,0,0); }
function drawQmarks(single,sStat){
  $('#res-qm').innerHTML=sStat.map((s,q)=>{ const m=single[q];
    const letra=m>=0?itemLabel(m):'—'; const cor=itemLabel(SCAN.gab.corretas[q+SCAN.res.r0]);
    const un=SCAN.res.d.unc&&SCAN.res.d.unc[q];
    return `<div class="qmark ${s==='ok'?'g':s==='err'?'r':'y'}"${un?' style="outline:2px dashed var(--abl);outline-offset:1px"':''} title="Q${q+1+SCAN.res.r0}: ${s==='ok'?'acerto':s==='err'?`item ${letra}`:`em branco · correta ${cor}`}">
      <b>Q${q+1+SCAN.res.r0}</b><i>${s==='ok'?'✓':s==='err'?'✗':'—'}</i><span style="color:var(--mut)">${letra}</span></div>`;}).join('');
}
function drawMatrix(single){
  const R=SCAN.res,g=SCAN.gab;
  $('#res-mx').innerHTML=Array.from({length:R.r1-R.r0},(_,q)=>`<div class="mrow"><span class="qn">Q${q+R.r0+1}</span>
    <div class="row" style="gap:6px;flex-wrap:wrap">${Array.from({length:g.itens[q+R.r0]},(_,i)=>
      `<button type="button" class="bub${single[q]===i?' sel':''}" data-q="${q}" data-i="${i}" style="width:26px;height:26px">${itemLabel(i)}</button>`).join('')}</div></div>`).join('');
}

window.GS={open:abrirScanner,folha:gerarPdf,toast};
})();

<script id="gs-host">
/* ═══════════════ RELAÇÃO NOMINAL + CORREÇÃO POR CÂMERA ═══════════════ */
(function(){
  const NOM = { A: [], B: [] };
  let CUR = null;
  const norm = s => String(s || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').trim().toUpperCase().replace(/\s+/g, ' ');
  const LETRAS = 'ABCD';

  function nk(t) { return K('nominal' + t); }
  function loadNom() {
    ['A', 'B'].forEach(t => { try { NOM[t] = JSON.parse(localStorage.getItem(nk(t)) || '[]'); } catch (e) { NOM[t] = []; } });
    if (db) ['A', 'B'].forEach(t => db.ref(FB('nominal' + t)).on('value', s => {
      NOM[t] = Object.values(s.val() || {});
      localStorage.setItem(nk(t), JSON.stringify(NOM[t]));
      renderNominal(t);
    }, () => {}));
  }
  function saveNom(t) {
    localStorage.setItem(nk(t), JSON.stringify(NOM[t]));
    if (db) db.ref(FB('nominal' + t)).set(NOM[t]).catch(() => {});
  }

  /* folha oficial com o mesmo modelo do corretor (marcas fiduciais + bolhas) */
  function sheetGab(t) {
    ensureGabarito();
    const corretas = [];
    for (let q = 1; q <= NQ; q++) {
      const r = String((gabarito['q' + q] || {}).resp || '').toUpperCase();
      corretas.push(LETRAS.indexOf(r));
    }
    return {
      id: 'sim' + MODE_ID,
      nome: `Simulado de ${NQ} questões${t ? ' · 4° Ano ' + t : ''}`,
      escola: 'Avaliação Escolar — 4° Ano' + (t ? ' ' + t : ' A & B'),
      itens: Array(NQ).fill(4),
      corretas,
    };
  }
  function baixarFolha(t) { window.GS.folha(sheetGab(t)); }

  function getRaw(t) {
    try { const r = localStorage.getItem(K('raw' + t)); if (r) return JSON.parse(r); } catch (e) {}
    const arr = t === 'A' ? resultadosA : resultadosB;
    return arr.map(a => [a.numero, a.nome, ...Array.from({ length: NQ }, (_, k) => ((a.respostas || {})['q' + (k + 1)] || {}).respAluno || '')]);
  }
  function persistRaw(t, raw) {
    try { localStorage.setItem(K('raw' + t), JSON.stringify(raw)); } catch (e) {}
    const alunos = raw.map(r => parseAluno(r, t));
    if (t === 'A') resultadosA = alunos; else resultadosB = alunos;
    localStorage.setItem(K('resultados' + t), JSON.stringify(alunos));
    if (db) {
      db.ref(FB('resultados' + t)).set(alunos).catch(() => {});
      db.ref(FB('raw' + t)).set(raw).catch(() => {});
    }
    updateImportBadges();
    renderTurmaPage(t);
    renderNominal(t);
  }

  window.GS_HOST = {
    gab: () => CUR ? sheetGab(CUR.t) : null,
    save: (id, single) => {
      if (!CUR) return false;
      const { t, aluno } = CUR;
      const row = [aluno.numero, aluno.nome, ...single.map(m => m >= 0 ? LETRAS[m] || '' : '')];
      const raw = getRaw(t);
      const i = raw.findIndex(r => norm(r[1]) === norm(aluno.nome));
      if (i >= 0) raw[i] = row; else raw.push(row);
      const ordem = new Map(NOM[t].map((a, k) => [norm(a.nome), k]));
      raw.sort((a, b) => (ordem.has(norm(a[1])) ? ordem.get(norm(a[1])) : 1e6) - (ordem.has(norm(b[1])) ? ordem.get(norm(b[1])) : 1e6));

      const i = raw.findIndex(r => norm(r[1]) === norm(aluno.nome));
      if (i < 0) { window.GS.toast('Nada salvo deste aluno para excluir', 'abl'); return true; }
      if (!confirm(`Excluir a leitura salva de ${aluno.nome}?`)) return false;
      raw.splice(i, 1);
      persistRaw(t, raw);
      window.GS.toast('Leitura excluída');
      return true;
    },
  };

  function capturar(t, i) {
    ensureGabarito();
    const temGab = Object.keys(gabarito).length && Array.from({ length: NQ }, (_, k) => (gabarito['q' + (k + 1)] || {}).resp).some(Boolean);
    if (!temGab) { window.GS.toast('Salve o Gabarito Oficial antes de capturar', 'err'); return; }
    const aluno = NOM[t][i]; if (!aluno) return;
    CUR = { t, aluno };
    window.GS.open(t + ':' + i, aluno.nome);
  }

  function importarNominal(t, file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'binary' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        const list = [];
        rows.forEach(r => {
          const cells = r.map(c => String(c).trim()).filter(Boolean);
          if (!cells.length) return;
          const textos = cells.filter(c => !/^\d+([.,]\d+)?$/.test(c) && c.length >= 3 && !/^[A-E]$/i.test(c));
          if (!textos.length) return;
          const nome = textos.sort((a, b) => b.length - a.length)[0];

          const num = cells.find(c => /^\d+$/.test(c));

        });
        if (!list.length) { msg('nom-msg-' + t, '⚠️ Nenhum nome encontrado na planilha.', 'a-warn'); return; }
        if (NOM[t].length && !confirm(`Substituir a relação nominal atual do 4° Ano ${t} (${NOM[t].length} nomes) por ${list.length} nomes?`)) return;
        NOM[t] = list; saveNom(t); renderNominal(t);
        msg('nom-msg-' + t, `✅ ${list.length} nomes importados para o 4° Ano ${t}.`, 'a-ok');
      } catch (err) { msg('nom-msg-' + t, '❌ Erro ao ler a planilha: ' + err.message, 'a-err'); }
    };

  function limparNominal(t) {
    if (!NOM[t].length) return;

    NOM[t] = []; saveNom(t); renderNominal(t);
  }

  function renderNominal(t) {
    const el = document.getElementById('nom-list-' + t);
    if (!el) return;

    const by = new Map(arr.map(a => [norm(a.nome), a]));
    const feitos = NOM[t].filter(a => by.has(norm(a.nome))).length;
    const cnt = document.getElementById('nom-cnt-' + t);
    if (cnt) cnt.textContent = NOM[t].length ? `${feitos}/${NOM[t].length} corrigidos` : '';
    if (!NOM[t].length) {
      el.innerHTML = `<p class="muted nom-empty">Importe a relação nominal (planilha com os nomes dos alunos) para lançar os resultados pela câmera do celular.</p>`;
      return;
    }
    el.innerHTML = `<div class="nom-fila">${NOM[t].map((a, i) => {
      const r = by.get(norm(a.nome));
      const p = r ? r.pctGeral : 0;
      const badge = r
        ? `<span class="nom-pill ${p >= 60 ? 'ok' : p >= 40 ? 'abl' : 'err'}">${r.total}/${NQ} · ${p}%</span>`
        : `<span class="nom-pill mut">não corrigido</span>`;
      return `<div class="nom-row"><span class="nom-idx">${esc(a.numero)}</span><span class="nom-nm">${esc(a.nome)}</span>${badge}
        <button type="button" class="nom-cap" data-t="${t}" data-i="${i}">📷 ${r ? 'Recapturar' : 'Capturar'}</button></div>`;
    }).join('')}</div>`;
    el.querySelectorAll('.nom-cap').forEach(b => b.addEventListener('click', () => capturar(b.dataset.t, +b.dataset.i)));
  }

  function injectUI() {
    ['A', 'B'].forEach(t => {
      const sec = document.getElementById('sec-turma' + t);
      if (!sec || document.getElementById('nom-card-' + t)) return;
      sec.insertAdjacentHTML('afterbegin', `
      <div class="card nom-card" id="nom-card-${t}">
        <div class="card-title">
          <h2>📋 Relação Nominal — 4° Ano ${t} <span class="nom-cnt" id="nom-cnt-${t}"></span></h2>
          <div class="btns">
            <label class="btn btn-success btn-sm" style="cursor:pointer">📥 Importar relação nominal
              <input type="file" accept=".xls,.xlsx,.csv" hidden id="nom-file-${t}"></label>
            <button type="button" class="btn btn-outline btn-sm" id="nom-folha-${t}">📄 Baixar folha oficial de gabarito</button>
            <button type="button" class="btn btn-outline btn-sm" id="nom-clear-${t}">🗑️ Limpar</button>
          </div>
        </div>
        <div class="alert a-info">📷 Toque em <strong>Capturar</strong> ao lado do nome para abrir a câmera do celular (em pé ou deitado) e ler a folha oficial do aluno. O resultado é lançado automaticamente no ranking, nos resultados individuais, no gabarito visual, no dashboard e nos descritores.</div>
        <div id="nom-msg-${t}"></div>
        <div id="nom-list-${t}"></div>
      </div>`);
      document.getElementById('nom-file-' + t).addEventListener('change', e => { importarNominal(t, e.target.files[0]); e.target.value = ''; });
      document.getElementById('nom-folha-' + t).addEventListener('click', () => baixarFolha(t));
      document.getElementById('nom-clear-' + t).addEventListener('click', () => limparNominal(t));
    });
    const gb = document.querySelector('#sec-gabarito .card-title .btns');
    if (gb && !document.getElementById('gab-folha-btn')) {
      gb.insertAdjacentHTML('afterbegin', `<button type="button" class="btn btn-outline btn-sm" id="gab-folha-btn">📄 Baixar folha oficial de gabarito</button>`);
      document.getElementById('gab-folha-btn').addEventListener('click', () => baixarFolha(''));
    }
  }

  function afterInit() { injectUI(); loadNom(); renderNominal('A'); renderNominal('B'); }

  const _init = initLegacyApp;
  initLegacyApp = function (m) { _init(m); afterInit(); };
  const _show = showTab;
  showTab = function (tab) { _show(tab); if (tab === 'turmaA') renderNominal('A'); if (tab === 'turmaB') renderNominal('B'); };
  const _rer = rerenderCurrent;
  rerenderCurrent = function () { _rer(); renderNominal('A'); renderNominal('B'); };
  afterInit();
})();

</script>
</body>
</html>
