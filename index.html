<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Avaliação Escolar — 4° Ano | Simulados de 30 e 44 Questões</title>
<meta name="description" content="Correção de simulados de 30 ou 44 questões do 4° ano: gabarito com descritores, importação de planilha, dashboards, rankings por turma, gabarito visual, PCD e análise por descritores." />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
* , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f1f5fb; color: #1e2a3b; min-height: 100vh; }
.legacy-app {
      --primary: #1a56db;
      --primary-dark: #1239a5;
      --secondary: #7e3af2;
      --success: #0ea472;
      --danger: #e02424;
      --warning: #e07b00;
      --bg: #f1f5fb;
      --surface: #ffffff;
      --border: #dde3ef;
      --text: #1e2a3b;
      --muted: #6b7a99;
      --port-blue: #0284c7;
      --port-bg: #e0f2fe;
      --math-purple: #7c3aed;
      --math-bg: #ede9fe;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* HEADER */
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: #fff; padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 12px rgba(0,0,0,.2);
      position: sticky; top: 0; z-index: 100;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    .fb-badge { background: rgba(255,255,255,.2); border-radius: 999px; padding: .22rem .8rem; font-size: .75rem; font-weight: 600; }

    /* NAV */
    nav { background: var(--surface); border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; padding: 0 1.25rem; }
    nav button { background: none; border: none; padding: .8rem 1.2rem; font-size: .86rem; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; transition: all .15s; }
    nav button:hover { color: var(--primary); }
    nav button.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* MAIN */
    main { max-width: 1180px; margin: 0 auto; padding: 1.75rem 1.25rem; }
    .section { display: none; }
    .section.active { display: block; }

    /* CARD */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.4rem; margin-bottom: 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
    .card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; }
    .card-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .card-title h2 { margin: 0; }

    /* GRIDS */
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    @media(max-width:760px) { .g2,.g3,.g4 { grid-template-columns: 1fr; } }

    /* STAT */
    .stat { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem; text-align: center; }
    .stat .val { font-size: 1.9rem; font-weight: 800; color: var(--primary); line-height: 1; }
    .stat .lbl { font-size: .72rem; color: var(--muted); margin-top: .3rem; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }

    /* FORM */
    label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: .3rem; }
    input[type=text], select, textarea { width: 100%; padding: .55rem .8rem; border: 1.5px solid var(--border); border-radius: 8px; font-size: .88rem; color: var(--text); background: #fff; outline: none; transition: border-color .15s; }
    input[type=text]:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,86,219,.1); }
    .fg { margin-bottom: .9rem; }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .55rem 1.1rem; border-radius: 8px; font-size: .85rem; font-weight: 600; cursor: pointer; border: none; transition: all .15s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #0a7f59; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
    .btn-outline:hover { background: var(--primary); color: #fff; }
    .btn-sm { padding: .38rem .8rem; font-size: .78rem; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btns { display: flex; gap: .6rem; flex-wrap: wrap; }

    /* GABARITO */
    .area-title { display: flex; align-items: center; gap: .6rem; margin-bottom: .9rem; font-size: .97rem; font-weight: 700; }
    .pill { font-size: .72rem; padding: .18rem .65rem; border-radius: 999px; font-weight: 600; }
    .pill-p { background: var(--port-bg); color: var(--port-blue); }
    .pill-m { background: var(--math-bg); color: var(--math-purple); }

    .qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: .65rem; }
    .qcard { border: 1.5px solid var(--border); border-radius: 10px; padding: .7rem; background: #fafbfd; }
    .qcard.qp { border-left: 4px solid var(--port-blue); }
    .qcard.qm { border-left: 4px solid var(--math-purple); }
    .qnum-lbl { font-size: .7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: .4rem; }
    .qrow { display: flex; gap: .4rem; align-items: center; }
    .qrow label { font-size: .7rem; margin: 0; white-space: nowrap; }
    .qrow select { flex: 1; padding: .32rem .45rem; font-size: .83rem; }
    .qrow input[type=text] { width: 58px; padding: .32rem .45rem; font-size: .83rem; }

    /* FILE DROP */
    .drop-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 2.2rem; text-align: center; cursor: pointer; transition: all .2s; }
    .drop-zone:hover, .drop-zone.over { border-color: var(--primary); background: rgba(26,86,219,.03); }
    .drop-icon { font-size: 2.3rem; margin-bottom: .65rem; }
    .drop-zone p { font-size: .88rem; color: var(--muted); }
    .drop-zone strong { color: var(--primary); }

    /* CLASS SELECTOR */
    .class-sel { display: flex; gap: .5rem; margin-bottom: 1.2rem; }
    .class-btn { padding: .45rem 1.2rem; border-radius: 8px; font-size: .86rem; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: #fff; color: var(--muted); transition: all .15s; }
    .class-btn.a-act { background: var(--port-bg); color: var(--port-blue); border-color: var(--port-blue); }
    .class-btn.b-act { background: var(--math-bg); color: var(--math-purple); border-color: var(--math-purple); }
    .class-btn.all-act { background: #f0fdf4; color: #166534; border-color: #4ade80; }

    /* TABLE */
    .tbl-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: .81rem; }
    th { background: #f8fafd; padding: .6rem .9rem; text-align: left; font-weight: 700; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .4px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: .6rem .9rem; border-bottom: 1px solid #f0f2f7; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafd; }

    /* RANK */
    .rnum { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: .78rem; }
    .r1 { background: #fbbf24; color: #78350f; }
    .r2 { background: #94a3b8; color: #fff; }
    .r3 { background: #cd7c46; color: #fff; }
    .rn { background: var(--bg); color: var(--muted); }

    /* PROGRESS */
    .pg-wrap { background: #eef0f5; border-radius: 999px; height: 7px; width: 100%; }
    .pg-bar { height: 7px; border-radius: 999px; background: linear-gradient(90deg, var(--success), #34d399); transition: width .4s; }
    .pg-bar.warn { background: linear-gradient(90deg, var(--warning), #facc15); }
    .pg-bar.bad  { background: linear-gradient(90deg, var(--danger), #f87171); }

    /* CHARTS */
    .chart-box { position: relative; height: 270px; }
    .chart-box-lg { position: relative; height: 320px; }

    /* ALERTS */
    .alert { padding: .75rem 1rem; border-radius: 9px; font-size: .86rem; font-weight: 500; margin-bottom: .9rem; }
    .a-info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .a-ok   { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .a-warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    .a-err  { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

    /* TAGS */
    .tag { display: inline-block; padding: .18rem .55rem; border-radius: 5px; font-size: .7rem; font-weight: 700; }
    .tag-a { background: var(--port-bg); color: var(--port-blue); }
    .tag-b { background: var(--math-bg); color: var(--math-purple); }

    /* MISC */
    hr.sep { border: none; border-top: 1px solid var(--border); margin: 1.1rem 0; }
    .tc { text-align: center; }
    .muted { color: var(--muted); }
    .sm { font-size: .8rem; }
    .mt { margin-top: .75rem; }
    .mt2 { margin-top: 1.1rem; }
    .flex { display: flex; }
    .aic { align-items: center; }
    .jcb { justify-content: space-between; }
    .gap { gap: .6rem; }
    .fw { flex-wrap: wrap; }

    .fb-banner { display:none; }

    .import-sel { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    .import-sel h3 { font-size:.88rem; font-weight:700; margin-bottom:.6rem; }
    .turma-btns { display:flex; gap:.5rem; }
    .turma-btn { padding:.45rem 1.4rem; border-radius:8px; border:1.5px solid var(--border); background:#fff; font-size:.85rem; font-weight:600; cursor:pointer; transition:all .15s; color:var(--muted); }
    .turma-btn.sel-a { background:var(--port-bg); color:var(--port-blue); border-color:var(--port-blue); }
    .turma-btn.sel-b { background:var(--math-bg); color:var(--math-purple); border-color:var(--math-purple); }

    .spinner { display:inline-block; width:16px; height:16px; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .6s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .fade { animation: fadeIn .3s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

    /* IMPORT INDICATOR */
    .import-status { display:flex; gap:1.25rem; flex-wrap:wrap; margin-bottom:1rem; }
    .import-badge { display:flex; align-items:center; gap:.4rem; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:.45rem .85rem; font-size:.82rem; font-weight:600; }
    .import-badge .dot { width:8px;height:8px;border-radius:50%; }
    .dot-ok { background:var(--success); }
    .dot-no { background:#d1d5db; }

    /* ── RANKING MODERNO ── */
    .rank-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.04); }
    .rank-card-header { display:flex; align-items:center; justify-content:space-between; padding:.85rem 1.1rem; border-bottom:1px solid var(--border); }
    .rank-card-header h3 { font-size:.95rem; font-weight:800; margin:0; }
    .sub-nav { display:flex; gap:.4rem; margin-bottom:1.3rem; border-bottom:2px solid var(--border); padding-bottom:.55rem; }
    .sub-btn { background:none; border:none; padding:.48rem 1.1rem; font-size:.84rem; font-weight:600; color:var(--muted); cursor:pointer; border-radius:8px 8px 0 0; transition:all .15s; white-space:nowrap; }
    .sub-btn:hover { background:var(--bg); color:var(--text); }
    .sub-btn.active { background:var(--primary); color:#fff; }
    .rank-table { width:100%; border-collapse:collapse; }
    .rank-table tbody tr { transition:background .1s; }
    .rank-table tbody tr:nth-child(even) { background:#fafbfd; }
    .rank-table tbody tr:hover { background:#eff4ff; }
    .rank-table td { padding:.6rem .95rem; border-bottom:1px solid #f0f2f7; vertical-align:middle; }
    .rank-table tr:last-child td { border-bottom:none; }
    .rk-pos { width:38px; text-align:center; }
    .rk-medal { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; font-weight:800; font-size:.78rem; }
    .medal-1 { background:#fbbf24; color:#78350f; }
    .medal-2 { background:#94a3b8; color:#fff; }
    .medal-3 { background:#b87333; color:#fff; }
    .rk-num { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; background:var(--bg); color:var(--muted); font-weight:700; font-size:.78rem; }
    .rk-name { font-weight:700; font-size:.86rem; color:#1e3a8a; background:#93c5fd; padding:.2rem .65rem; border-radius:6px; display:inline-block; }
    .rk-sub  { font-size:.72rem; color:var(--muted); }
    .rk-score { width:78px; text-align:center; }
    .score-pill { display:inline-flex; flex-direction:column; align-items:center; justify-content:center; width:72px; padding:.45rem .3rem; border-radius:10px; font-weight:800; font-size:.95rem; line-height:1.1; }
    .score-pill small { font-size:.65rem; font-weight:600; opacity:.85; margin-top:.1rem; }
    .score-adequado     { background:#166534; color:#fff; }
    .score-intermediario { background:#4ade80; color:#14532d; }
    .score-critico      { background:#f59e0b; color:#78350f; }
    .score-muito-critico { background:#dc2626; color:#fff; }

    /* ── GABARITO VISUAL ── */
    .gab-visual-wrap { overflow-x:auto; border-radius:10px; border:1px solid var(--border); }
    .gab-table { border-collapse:collapse; font-size:.74rem; white-space:nowrap; width:100%; }
    .gab-table thead th {
      background:#1e2a3b; color:#fff; padding:.42rem .35rem;
      text-align:center; font-weight:700; font-size:.7rem;
      position:sticky; top:0; z-index:1; border:1px solid #374151;
    }
    .gab-table thead th.th-nome {
      text-align:left; min-width:195px; padding-left:.8rem;
      position:sticky; left:38px; z-index:2; background:#1e2a3b;
    }
    .gab-table thead th.th-nr {
      position:sticky; left:0; z-index:2; background:#1e2a3b; width:34px;
    }
    .gab-table td { padding:.34rem .32rem; text-align:center; border:1px solid #e5e7eb; font-weight:700; }
    .gab-table td.td-nr   { width:34px; color:var(--muted); font-size:.7rem; position:sticky; left:0; background:#fff; z-index:1; }
    .gab-table td.td-nome { text-align:left; padding:.34rem .8rem; font-weight:600; color:var(--text); position:sticky; left:34px; background:#fff; border-right:2px solid #d1d5db; min-width:195px; z-index:1; }
    .gab-table tr:nth-child(even) td.td-nr,
    .gab-table tr:nth-child(even) td.td-nome { background:#fafbfd; }
    .gab-table tr:hover td { filter:brightness(.94); }
    .gc-ok    { background:#16a34a !important; color:#fff !important; }
    .gc-err   { background:#dc2626 !important; color:#fff !important; }
    .gc-blank { background:#fff; color:#d1d5db; }
    .gab-table td.td-total { font-weight:800; color:var(--primary); background:#eff4ff !important; min-width:52px; }
    .gab-table td.td-sit   { min-width:88px; }

    /* PDF printing */
    @media print {
      body * { visibility: hidden; }
      #pdf-print-area, #pdf-print-area * { visibility: visible; }
      #pdf-print-area { position:fixed; top:0; left:0; width:100%; background:#fff; padding:20px; }
    }

/* ═══════ Seletor de simulado ═══════ */
.mode-switch {
  background: #0f172a;
  display: flex; align-items: center; flex-wrap: wrap; gap: .6rem;
  padding: .85rem 2rem;
}
.mode-switch-label {
  color: #cbd5e1; font-size: .78rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .6px; margin-right: .3rem;
}
.mode-btn {
  background: rgba(255,255,255,.08); color: #e2e8f0;
  border: 1.5px solid rgba(255,255,255,.18); border-radius: 999px;
  padding: .5rem 1.15rem; font-size: .8rem; font-weight: 800; letter-spacing: .4px;
  cursor: pointer; transition: all .15s;
}
.mode-btn:hover { background: rgba(255,255,255,.16); }
.mode-btn.active {
  background: linear-gradient(135deg, #1a56db 0%, #7e3af2 100%);
  color: #fff; border-color: transparent;
  box-shadow: 0 3px 14px rgba(126,58,242,.45);
}
@media (max-width: 640px) {
  .mode-switch { padding: .75rem 1rem; }
  .mode-btn { flex: 1 1 100%; text-align: center; }
}

</style>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@110,600;110,800&family=IBM+Plex+Mono:wght@500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="gs-css">
#gs-root{  --bg:#0E1218; --panel:#151B24; --panel2:#1B2330; --line:#2A3543; --line-soft:#212B38;
  --txt:#EAEFF5; --mut:#8DA0B4; --dim:#5C6B7C;
  --ok:#3ECF8E; --ok-bg:rgba(62,207,142,.14);
  --err:#F4605B; --err-bg:rgba(244,96,91,.14);
  --abl:#FFC53D; --abl-bg:rgba(255,197,61,.16);
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --disp:'Archivo',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sh:0 12px 32px rgba(0,0,0,.42);font-family:var(--body);color:var(--txt)}
#gs-root *{box-sizing:border-box;margin:0;padding:0}
#gs-root button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#gs-root input,#gs-root select,#gs-root textarea{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;width:100%;outline:none}
#gs-root [hidden]{display:none!important}
#gs-root .mono{font-family:var(--mono)}
#gs-root .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 17px;border-radius:var(--r-md);
  font-weight:600;font-size:14px;border:1px solid var(--line);color:var(--txt);background:var(--panel2);
  transition:transform .1s,border-color .15s,background .15s;white-space:nowrap}
#gs-root .btn:hover{border-color:var(--dim);background:#202939}
#gs-root .btn:active{transform:scale(.98)}
#gs-root .btn svg{width:17px;height:17px;flex:none}
#gs-root .btn-pri{background:var(--abl);color:#231A02;border-color:var(--abl)}
#gs-root .btn-pri:hover{background:#ffd35e;border-color:#ffd35e}
#gs-root .btn-cap{background:var(--ok);color:#03251a;border-color:var(--ok)}
#gs-root .btn-cap:hover{background:#5ce0a4;border-color:#5ce0a4}
#gs-root .btn-err{color:var(--err);border-color:rgba(244,96,91,.4)}
#gs-root .btn-err:hover{background:var(--err-bg);border-color:var(--err)}
#gs-root .btn-sm{padding:8px 12px;font-size:12.5px;border-radius:10px}
#gs-root .btn-ghost{background:transparent;border-color:transparent;color:var(--mut)}
#gs-root .btn-ghost:hover{color:var(--txt);background:var(--panel2);border-color:transparent}
#gs-root .btn:disabled{opacity:.45;cursor:not-allowed}
#gs-root .icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--mut);border:1px solid transparent}
#gs-root .icon-btn:hover{color:var(--err);border-color:rgba(244,96,91,.35)}
#gs-root .icon-btn svg{width:16px;height:16px}
#gs-root .field{margin-bottom:13px}
#gs-root .field label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:6px;letter-spacing:.02em}
#gs-root .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){#gs-root .grid2{grid-template-columns:1fr}}
#gs-root .row{display:flex;gap:10px;align-items:center}
#gs-root .spacer{flex:1}
#gs-root .empty{text-align:center;padding:42px 20px;border:1.5px dashed var(--line);border-radius:var(--r-lg);color:var(--mut)}
#gs-root .empty .e-bub{display:flex;gap:9px;justify-content:center;margin-bottom:14px}
#gs-root .empty .e-bub i{width:15px;height:15px;border-radius:50%;border:1.6px solid var(--line);background:var(--panel2)}
#gs-root .empty .e-bub i:nth-child(2){border-color:var(--abl);background:var(--abl-bg)}
#gs-root .empty strong{color:var(--txt);display:block;margin-bottom:4px;font-size:15px}
#gs-root .pill{display:inline-flex;align-items:center;gap:6px;padding:3.5px 10px;border-radius:99px;font-size:11.5px;font-weight:600;
  font-family:var(--mono);letter-spacing:.03em}
#gs-root .pill.ok{background:var(--ok-bg);color:var(--ok)}
#gs-root .pill.err{background:var(--err-bg);color:var(--err)}
#gs-root .pill.abl{background:var(--abl-bg);color:var(--abl)}
#gs-root .pill.mut{background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
#gs-root .toast-wrap{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column-reverse;gap:8px;width:min(420px,92vw);pointer-events:none}
#gs-root .toast{background:#202A38;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 15px;font-size:13.5px;
  box-shadow:var(--sh);display:flex;gap:10px;align-items:center;animation:gsToIn .25s cubic-bezier(.2,.9,.3,1)}
#gs-root .toast i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)}
#gs-root .toast.err i{background:var(--err)}
#gs-root .toast.abl i{background:var(--abl)}
@keyframes gsToIn{from{opacity:0;transform:translateY(10px)}}
#gs-root .modal-bg{position:fixed;inset:0;z-index:70;background:rgba(6,9,13,.72);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:16px;animation:gsMIn .22s ease}
@keyframes gsMIn{from{opacity:0}}
#gs-root .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);width:min(560px,96vw);
  max-height:92dvh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh);animation:gsMdUp .28s cubic-bezier(.2,.9,.3,1)}
@keyframes gsMdUp{from{transform:translateY(16px);opacity:0}}
#gs-root .modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-soft);
  position:sticky;top:0;background:var(--panel);z-index:2;flex:none}
#gs-root .modal-head h3{font-family:var(--disp);font-stretch:110%;font-weight:800;font-size:17px}
#gs-root .modal-body{padding:18px;overflow:auto;min-height:0;flex:1}
#gs-root .x-btn{margin-left:auto;width:32px;height:32px;display:grid;place-items:center;border-radius:9px;color:var(--mut)}
#gs-root .x-btn:hover{color:var(--txt);background:var(--panel2)}
#gs-root .dots-bg{background-image:radial-gradient(rgba(141,160,180,.12) 1.2px,transparent 1.2px);background-size:20px 20px}
#gs-root .matrix{font-family:var(--mono);font-size:12px}
#gs-root .mrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line-soft)}
#gs-root .mrow:last-child{border:0}
#gs-root .mrow .qn{width:30px;color:var(--mut);text-align:right;flex:none;font-size:11.5px}
#gs-root .bub{width:30px;height:30px;border-radius:50%;border:1.7px solid var(--line);background:var(--panel2);color:var(--mut);
  display:grid;place-items:center;font-weight:600;font-size:12px;transition:transform .08s,border-color .12s;flex:none;cursor:pointer}
#gs-root .bub:hover{border-color:var(--dim);transform:scale(1.08)}
#gs-root .bub.sel{background:var(--abl);border-color:var(--abl);color:#231A02;box-shadow:0 0 0 3px var(--abl-bg)}
#gs-root .bub.det-ok{background:var(--ok);border-color:var(--ok);color:#03251a}
#gs-root .bub.det-er{background:var(--err);border-color:var(--err);color:#2b0705}
#gs-root .bub.det-nm{border-color:var(--err);color:var(--err);border-style:dashed}
#gs-root .bub.det-cb{border-color:var(--abl);color:var(--abl);box-shadow:inset 0 0 0 2.5px var(--abl-bg)}
#gs-root .bub.det-x{background:var(--err);border-color:var(--err);color:#fff;box-shadow:0 0 0 2.5px var(--err-bg)}
#gs-root .matrix-scroll{max-height:340px;overflow:auto;padding-right:6px}
#gs-root .matrix-grid{display:flex;gap:6px;flex-wrap:wrap}
#gs-root .gab-cols{display:flex;gap:14px;overflow-x:auto;align-items:flex-start;-webkit-overflow-scrolling:touch}
#gs-root .gab-col{flex:none;min-width:max-content}
#gs-root .gab-cols .gab-col+.gab-col{border-left:1px dashed var(--line-soft);padding-left:14px}
#gs-root .sc-modal{width:min(680px,98vw);display:flex;flex-direction:column;max-height:94dvh}
#gs-root .sc-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
#gs-root .sc-head .who{font-size:11px;color:var(--mut)}
#gs-root .sc-head .who b{color:var(--txt);font-size:14px;display:block;font-family:var(--body)}
#gs-root .sc-steps{display:flex;gap:5px;margin-left:auto}
#gs-root .sc-steps i{width:22px;height:4px;border-radius:99px;background:var(--line)}
#gs-root .sc-steps i.on{background:var(--abl)}
#gs-root .sc-body{flex:1;min-height:0;display:flex;flex-direction:column;background:#0A0D12;position:relative}
#gs-root .sc-stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:12px;overflow:auto}
#gs-root .sc-stage video,#gs-root .sc-stage canvas.cap{max-width:100%;max-height:100%;width:auto;height:auto;display:block;border-radius:10px}
#gs-root .sc-hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:#cdd8e4;pointer-events:none;
  text-shadow:0 1px 6px rgba(0,0,0,.8);padding:0 14px}
#gs-root .reticle{position:absolute;inset:8%;pointer-events:none}
#gs-root .reticle span{position:absolute;width:30px;height:30px;border:2.5px solid var(--abl);opacity:.95;filter:drop-shadow(0 0 6px rgba(0,0,0,.6))}
#gs-root .reticle span:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
#gs-root .reticle span:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
#gs-root .reticle span:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
#gs-root .reticle span:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
#gs-root .reticle::after{content:"";position:absolute;left:5%;right:5%;height:2px;top:5%;
  background:linear-gradient(90deg,transparent,var(--ok),transparent);animation:gsScLaser 2.2s ease-in-out infinite alternate}
@keyframes gsScLaser{from{top:5%}to{top:92%}}
#gs-root .sc-foot{padding:13px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line-soft);background:var(--panel);
  display:flex;gap:9px;align-items:center;flex-wrap:wrap}
#gs-root .shutter{width:66px;height:66px;border-radius:50%;border:3px solid #fff;background:transparent;display:grid;place-items:center;margin:0 auto;flex:none}
#gs-root .shutter::after{content:"";width:52px;height:52px;border-radius:50%;background:#fff;transition:transform .1s}
#gs-root .shutter:hover::after{transform:scale(.92)}
#gs-root .shutter:active::after{transform:scale(.82);background:var(--abl)}
#gs-root .crop-holder{position:relative;touch-action:none;cursor:crosshair;width:100%;height:100%;display:grid;place-items:center;overflow:hidden}
#gs-root .crop-holder canvas{max-width:100%;max-height:56dvh;display:block;border-radius:10px}
#gs-root .crop-svg{position:absolute;inset:0;width:100%;height:100%}
#gs-root .crop-svg polygon{fill:rgba(255,197,61,.06);stroke:var(--abl);stroke-width:2.4;vector-effect:non-scaling-stroke}
#gs-root .crop-svg .maskout{fill:rgba(5,8,12,.72);fill-rule:evenodd}
#gs-root .crop-svg circle{fill:var(--abl);stroke:#0A0D12;stroke-width:2.5;cursor:grab}
#gs-root .analyzing{display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 10px;color:var(--mut);font-size:13.5px}
#gs-root .an-ring{width:74px;height:74px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ok);border-right-color:var(--abl);
  animation:gsSpin 1s linear infinite}
@keyframes gsSpin{to{transform:rotate(360deg)}}
#gs-root .an-sheet{display:flex;gap:6px}
#gs-root .an-sheet i{width:13px;height:13px;border-radius:50%;border:1.6px solid var(--line);animation:gsAnFlip 1.2s ease infinite}
#gs-root .an-sheet i:nth-child(2){animation-delay:.15s}
#gs-root .an-sheet i:nth-child(3){animation-delay:.3s}
#gs-root .an-sheet i:nth-child(4){animation-delay:.45s}
#gs-root .an-sheet i:nth-child(5){animation-delay:.6s}
@keyframes gsAnFlip{40%{background:var(--abl);border-color:var(--abl)}70%{background:var(--ok);border-color:var(--ok)}100%{}}
#gs-root .sc-result{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
@media (max-width:680px){#gs-root .sc-result{grid-template-columns:1fr}}
#gs-root .sc-imgwrap{background:#0A0D12;border-radius:12px;padding:8px;border:1px solid var(--line-soft)}
#gs-root .sc-imgwrap canvas,#gs-root .sc-imgwrap img{max-width:100%;display:block;border-radius:8px}
#gs-root .sc-side{display:flex;flex-direction:column;gap:10px;min-width:0}
#gs-root .score-big{display:flex;align-items:baseline;gap:10px}
#gs-root .score-big b{font-family:var(--disp);font-stretch:110%;font-weight:800;font-size:44px;line-height:1}
#gs-root .score-big small{color:var(--mut);font-size:12.5px}
#gs-root .qmark{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;padding:5px 7px;border-radius:8px;background:var(--panel2)}
#gs-root .qmark b{width:26px;text-align:right;color:var(--mut);font-weight:500;flex:none}
#gs-root .qmark i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:9.5px;color:#04150c;font-weight:700}
#gs-root .qmark.g i{background:var(--ok)}
#gs-root .qmark.r i{background:var(--err);color:#fff}
#gs-root .qmark.y i{background:transparent;border:2px solid var(--abl);color:var(--abl)}
#gs-root .qmark-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px;max-height:270px;overflow:auto;padding-right:4px}
#gs-root .qmark.mut i{background:var(--panel);border:1px solid var(--line);color:var(--dim)}
#gs-root .ask{border:1px solid var(--abl);background:var(--abl-bg);border-radius:12px;padding:12px 14px;font-size:13px;color:#ffe9ad}
#gs-root .ask b{display:block;margin-bottom:6px;color:var(--abl);font-size:13.5px}
#gs-root .cam-err{padding:34px 22px;text-align:center;color:var(--mut);font-size:14px;line-height:1.7}
#gs-root .cam-err strong{color:var(--txt);display:block;font-size:15.5px;margin-bottom:6px}
#gs-root .modal-bg{z-index:9000}#gs-root .toast-wrap{z-index:9100}
.nom-card .card-title h2{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.nom-cnt{font-size:.75rem;font-weight:700;color:var(--muted)}
.nom-empty{padding:1rem 0;font-size:.9rem}
.nom-fila{display:flex;flex-direction:column;gap:.45rem;margin-top:.6rem}
.nom-row{display:flex;align-items:center;gap:.75rem;border:1px solid var(--border);border-radius:10px;padding:.55rem .8rem;background:#fff}
.nom-idx{font-family:ui-monospace,monospace;font-size:.75rem;color:var(--muted);width:28px;flex:none}
.nom-nm{flex:1;min-width:0;font-weight:600;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nom-pill{font-size:.72rem;font-weight:700;padding:.2rem .6rem;border-radius:99px;white-space:nowrap}
.nom-pill.ok{background:#dcfce7;color:#166534}.nom-pill.abl{background:#fef3c7;color:#92400e}
.nom-pill.err{background:#fee2e2;color:#991b1b}.nom-pill.mut{background:#f3f4f6;color:#6b7280}
.nom-cap{background:#3ECF8E;color:#03251a;font-weight:700;font-size:.8rem;border:0;border-radius:9px;padding:.5rem .8rem;cursor:pointer;flex:none}
.nom-cap:hover{filter:brightness(1.07)}
@media (max-width:560px){.nom-row{flex-wrap:wrap}.nom-nm{flex-basis:calc(100% - 40px)}}

</style>
</head>
<body>
<div class="legacy-app">
  <div class="mode-switch">
    <span class="mode-switch-label">Escolha o simulado:</span>
        <button type="button" class="mode-btn" data-mode="30">SIMULADO DE 30 QUESTÕES</button>
        <button type="button" class="mode-btn" data-mode="44">SIMULADO DE 44 QUESTÕES</button>
  </div>
  <div id="app-root"></div>
</div>

<script type="text/template" id="legacy-markup"><header>
  <h1>📊 Avaliação Escolar — 4° Ano A &amp; B</h1>
  <span class="fb-badge" id="fbStatus" style="display:none"></span>
</header>

<nav>
  <button class="active" data-tab="gabarito">📝 Gabarito Oficial</button>
  <button data-tab="importar">📥 Importar Planilha</button>
  <button data-tab="dashboard">📈 Dashboard</button>
  <button data-tab="turmaA">📘 4° Ano A</button>
  <button data-tab="turmaB">📗 4° Ano B</button>
  <button data-tab="descritores">📋 Descritores</button>
</nav>

<main>

<!--
  ════════════════ FORMATO DA PLANILHA ════════════════
  Coluna A : Núm. da lista  — Número do aluno (01, 02…)
  Coluna B : Nome           — Nome completo do aluno
  Colunas de respostas: Q 1 → Q {{NQ}} — Resposta marcada (A, B, C ou D); em branco se não respondeu.
  Questões 1–{{PA}} = Português | Questões {{PA1}}–{{NQ}} = Matemática
-->

<!-- ════════════════ GABARITO ════════════════ -->
<section id="sec-gabarito" class="section active">

  <div class="card">
    <div class="card-title">
      <h2>📝 Gabarito Oficial — {{NQ}} Questões</h2>
      <div class="btns">
        <button class="btn btn-outline btn-sm" onclick="loadGabaritoFromStorage()">☁️ Carregar salvo</button>
        <button class="btn btn-success btn-sm" onclick="saveGabarito()">💾 Salvar Gabarito</button>
      </div>
    </div>

    <div class="alert a-info">
      ℹ️ Informe a <strong>resposta correta (A–D)</strong> e o <strong>código do descritor</strong> de cada questão.
      Questões <strong>1–{{PA}}</strong> = Português | Questões <strong>{{PA1}}–{{NQ}}</strong> = Matemática.
      Para anular uma questão, escolha <strong>NULA</strong> na resposta: o ponto será concedido a todos os alunos
      e ela aparece como <strong>N</strong> no gabarito visual.
    </div>

    <div class="area-title">📖 Português <span class="pill pill-p">Q1 – Q{{PA}}</span></div>
    <div class="qgrid" id="grid-port"></div>

    <hr class="sep" />

    <div class="area-title">🔢 Matemática <span class="pill pill-m">Q{{PA1}} – Q{{NQ}}</span></div>
    <div class="qgrid" id="grid-math"></div>

    <hr class="sep" />
    <div id="gab-msg"></div>
  </div>

</section>

<!-- ════════════════ IMPORTAR ════════════════ -->
<section id="sec-importar" class="section">

  <div class="card">
    <h2>📥 Importar Planilha de Respostas — {{NQ}} Questões</h2>
    <div class="alert a-info">
      📄 Formato esperado: <strong>coluna A</strong> = número da lista, <strong>coluna B</strong> = nome do aluno e, em seguida, <strong>{{NQ}} colunas de respostas</strong> (Q1 a Q{{NQ}}) com A, B, C ou D — em branco quando não respondeu.
      Questões <strong>1–{{PA}}</strong> = Português | Questões <strong>{{PA1}}–{{NQ}}</strong> = Matemática.
    </div>

    <!-- Status das turmas importadas -->
    <div class="import-status">
      <div class="import-badge">
        <div class="dot" id="dot-a"></div>
        <span>4° Ano A: <strong id="cnt-a">não importado</strong></span>
        <button class="btn btn-sm btn-danger" id="clear-a" onclick="clearTurma('A')" style="display:none">✕</button>
      </div>
      <div class="import-badge">
        <div class="dot" id="dot-b"></div>
        <span>4° Ano B: <strong id="cnt-b">não importado</strong></span>
        <button class="btn btn-sm btn-danger" id="clear-b" onclick="clearTurma('B')" style="display:none">✕</button>
      </div>
    </div>

    <div class="alert a-warn">
      ⚠️ Salve o <strong>Gabarito Oficial</strong> antes de importar. Para importar as duas turmas, importe uma planilha por vez selecionando a turma correspondente.
    </div>

    <!-- Seleção de turma -->
    <div class="import-sel">
      <h3>📌 A planilha que será importada é de qual turma?</h3>
      <div class="turma-btns">
        <button class="turma-btn" id="tb-A" onclick="selectTurmaImport('A')">📘 4° Ano A</button>
        <button class="turma-btn" id="tb-B" onclick="selectTurmaImport('B')">📗 4° Ano B</button>
      </div>
    </div>

    <div class="drop-zone" id="fileDrop" onclick="document.getElementById('fileInput').click()">
      <div class="drop-icon">📊</div>
      <p>Clique ou arraste a planilha aqui</p>
      <p><strong>Formatos: .xls, .xlsx</strong></p>
    </div>
    <input type="file" id="fileInput" accept=".xls,.xlsx" style="display:none" onchange="handleFile(this)" />

    <div id="import-preview" class="mt2"></div>
    <div id="import-msg" class="mt"></div>
  </div>

</section>

<!-- ════════════════ DASHBOARD ════════════════ -->
<section id="sec-dashboard" class="section">

  <div id="dash-empty" class="card tc" style="display:none">
    <p class="muted" style="padding:2rem;font-size:1rem">📭 Importe pelo menos uma planilha para ver o dashboard.</p>
  </div>

  <div id="dash-content" style="display:none">

    <!-- Gráfico comparativo — largura total -->
    <div class="card" style="margin-bottom:1.25rem">
      <h2>⚖️ Comparativo 4°A vs 4°B por Área</h2>
      <div class="chart-box"><canvas id="cComp"></canvas></div>
    </div>

    <!-- Duas colunas: A | B -->
    <div class="g2">

      <!-- ── 4° Ano A ── -->
      <div>
        <div style="font-size:1rem;font-weight:800;color:var(--port-blue);margin-bottom:.85rem">📘 4° Ano A</div>
        <div class="g2" style="margin-bottom:1rem">
          <div class="stat"><div class="val" id="dk-a-alunos">–</div><div class="lbl">Alunos</div></div>
          <div class="stat"><div class="val" id="dk-a-geral">–</div><div class="lbl">Média Geral</div></div>
          <div class="stat"><div class="val" id="dk-a-port">–</div><div class="lbl">Média Port.</div></div>
          <div class="stat"><div class="val" id="dk-a-math">–</div><div class="lbl">Média Mat.</div></div>
        </div>
        <div class="card"><h2>📊 Distribuição de Acertos</h2><div class="chart-box"><canvas id="cDistA"></canvas></div></div>
        <div class="card"><h2>📚 Português vs Matemática</h2><div class="chart-box"><canvas id="cAreaA"></canvas></div></div>
        <div class="card"><h2>❓ % Acerto por Questão</h2><div class="chart-box"><canvas id="cQuestA"></canvas></div></div>
      </div>

      <!-- ── 4° Ano B ── -->
      <div>
        <div style="font-size:1rem;font-weight:800;color:var(--math-purple);margin-bottom:.85rem">📗 4° Ano B</div>
        <div class="g2" style="margin-bottom:1rem">
          <div class="stat"><div class="val" id="dk-b-alunos">–</div><div class="lbl">Alunos</div></div>
          <div class="stat"><div class="val" id="dk-b-geral">–</div><div class="lbl">Média Geral</div></div>
          <div class="stat"><div class="val" id="dk-b-port">–</div><div class="lbl">Média Port.</div></div>
          <div class="stat"><div class="val" id="dk-b-math">–</div><div class="lbl">Média Mat.</div></div>
        </div>
        <div class="card"><h2>📊 Distribuição de Acertos</h2><div class="chart-box"><canvas id="cDistB"></canvas></div></div>
        <div class="card"><h2>📚 Português vs Matemática</h2><div class="chart-box"><canvas id="cAreaB"></canvas></div></div>
        <div class="card"><h2>❓ % Acerto por Questão</h2><div class="chart-box"><canvas id="cQuestB"></canvas></div></div>
      </div>

    </div>
  </div>

</section>

<!-- ════════════════ TURMA A ════════════════ -->
<section id="sec-turmaA" class="section">

  <div id="empty-turmaA" class="card tc" style="display:none">
    <p class="muted" style="padding:2rem;font-size:1rem">📭 Importe a planilha do 4° Ano A para ver os resultados.</p>
  </div>

  <div id="content-turmaA">
    <div class="g4" style="margin-bottom:1.25rem">
      <div class="stat"><div class="val" id="kA-alunos">–</div><div class="lbl">Alunos</div></div>

/* Aplicativo original (index.html) portado para o projeto.

const MODES = {

/* chaves de armazenamento por modo — o modo de 44 mantém as chaves antigas */

 apiKey: "AIzaSyCCQV__ouYgGFMuZtlQA9vcZdGjOYZj4VU",

/* ═══════════════════════════════ STATE ═══════════════════════════════ */
let db = null;
let gabarito = {};          // {q1:{resp,desc,area,num}, ...}
let resultadosA = [];       // alunos 4°A

let currentDescTab = 'A';

/* ═══════════════════════════════ SUB-TABS ═══════════════════════════════ */
function showSubTab(turma, tab) {

    b.classList.toggle('active', b.dataset.subtab === tab);

/* ═══════════════════════════════ NAV ═══════════════════════════════ */
let navBound = false;
function bindNav() {
  const root = document.querySelector('.legacy-app');
  if (!root || navBound) return;
  navBound = true;
  root.querySelectorAll('nav button').forEach(btn => {
    btn.addEventListener('click', () => showTab(btn.dataset.tab));
  });
  const dropEl = document.getElementById('fileDrop');
  if (dropEl) {
    dropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('over'); });
    dropEl.addEventListener('dragleave', () => dropEl.classList.remove('over'));
    dropEl.addEventListener('drop', e => {
      e.preventDefault();
      dropEl.classList.remove('over');
      if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
    });
  }
}


/* ═══════════════════════════════ FIREBASE ═══════════════════════════════ */
function connectFirebase() {
    const c = firebaseConfig;

    if (!c.apiKey || !c.databaseURL) return;

    try {
        const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(c);
        db = firebase.database(app);

        const badge = document.getElementById("fbStatus");
        if (badge) badge.style.display = "";
        db.ref(".info/connected").on("value", s => {
            const el = document.getElementById("fbStatus");
            if (el) el.textContent = s.val() ? "🟢 Firebase conectado" : "🔴 Firebase offline";
        });

    } catch(e) {
        console.warn(e);
    }
}

/* ═══════════════════════════════ GABARITO ═══════════════════════════════ */
function buildGabaritoGrid() {
  buildGrid('grid-port', 1, PA, 'qp', 'Português');
  buildGrid('grid-math', PA + 1, NQ, 'qm', 'Matemática');
}

function buildGrid(cid, from, to, cls, area) {
  const c = document.getElementById(cid);
  c.innerHTML = '';
  for (let q = from; q <= to; q++) {
    const d = document.createElement('div');
    d.className = `qcard ${cls}`;
    d.innerHTML = `
      <div class="qnum-lbl">Q${q} — ${area}</div>
      <div class="qrow">
        <label>Resp:</label>
        <select id="gr-${q}"><option value="">—</option><option>A</option><option>B</option><option>C</option><option>D</option><option value="NULA">NULA (anulada)</option></select>
        <label>Desc:</label>
        <input type="text" id="gd-${q}" placeholder="D01" maxlength="8" />
      </div>`;
    c.appendChild(d);
  }
}

function collectGabarito() {
  const g = {};
  for (let q = 1; q <= NQ; q++) {
    const resp = gv(`gr-${q}`).toUpperCase();
    g[`q${q}`] = {
      resp,
      nula: resp === 'NULA',
      desc: gv(`gd-${q}`).trim().toUpperCase(),
      area: q <= PA ? 'Português' : 'Matemática',
      num: q
    };
  }
  return g;
}

/* rótulo curto do gabarito para tabelas (questão anulada = N) */
function gabLabel(gab) {
  if (!gab || !gab.resp) return '–';
  return (gab.nula || gab.resp === 'NULA') ? 'N' : gab.resp;
}

function fillGabaritoForm(g) {
  for (let q = 1; q <= NQ; q++) {
    const k = `q${q}`;
    if (!g[k]) continue;
    const r = document.getElementById(`gr-${q}`);
    const d = document.getElementById(`gd-${q}`);
    if (r) r.value = g[k].resp || '';
    if (d) d.value = g[k].desc || '';
  }
}

async function saveGabarito() {
  const g = collectGabarito();
  gabarito = g;
  localStorage.setItem(K('gabarito'), JSON.stringify(g));
  if (db) {
    try {
      await db.ref(FB('gabarito')).set(g);
      msg('gab-msg','✅ Gabarito salvo no Firebase e localmente!','a-ok');
    } catch(e) {
      msg('gab-msg','💾 Salvo localmente (Firebase: '+e.message+')','a-warn');
    }
  } else {
    msg('gab-msg','💾 Gabarito salvo localmente (Firebase não conectado).','a-warn');
  }
  // Recalcular resultados com novo gabarito
  recalcAll();
}

async function loadGabaritoFromStorage() {
  if (db) {
    try {
      const snap = await db.ref(FB('gabarito')).get();
      if (snap.exists()) {
        gabarito = snap.val();
        fillGabaritoForm(gabarito);
        localStorage.setItem(K('gabarito'), JSON.stringify(gabarito));
        msg('gab-msg','☁️ Gabarito carregado do Firebase!','a-ok');
        recalcAll();
        return;
      }
    } catch(e) {}
  }
  const local = localStorage.getItem(K('gabarito'));
  if (local) {
    gabarito = JSON.parse(local);
    fillGabaritoForm(gabarito);
    msg('gab-msg','📂 Gabarito carregado do armazenamento local.','a-info');
    recalcAll();
  } else {
    msg('gab-msg','Nenhum gabarito encontrado.','a-warn');
  }
}

/* ═══════════════════════════════ IMPORT ═══════════════════════════════ */
function selectTurmaImport(t) {
  importTurma = t;
  ['A','B'].forEach(x => {
    const b = document.getElementById('tb-'+x);
    b.className = 'turma-btn' + (x === t ? (t==='A'?' sel-a':' sel-b') : '');
  });
}

/* o arrastar-e-soltar é ligado em bindNav() */


function handleFile(inp) { if(inp.files[0]) processFile(inp.files[0]); }

function processFile(file) {
  const ext = file.name.slice(file.name.lastIndexOf('.')).toLowerCase();
  if (!['.xls','.xlsx'].includes(ext)) { msg('import-msg','❌ Use .xls ou .xlsx','a-err'); return; }

  ensureGabarito();
  if (!Object.keys(gabarito).length) {
    msg('import-msg','⚠️ Gabarito oficial não encontrado. Vá à aba "Gabarito Oficial" e salve-o primeiro.','a-warn');
    return;
  }

  msg('import-msg','<span class="spinner"></span> Lendo planilha...','a-info');

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'binary' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      // header:1 para array de arrays; defval:'' para células vazias
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

      // Identifica linha de cabeçalho
      // O cabeçalho contém "Núm. da lista" ou "Nome" na primeira ou segunda coluna
      let dataStart = 0;
      for (let i = 0; i < Math.min(5, rows.length); i++) {
        const row = rows[i];
        const joined = row.join('|').toLowerCase();
        if (joined.includes('núm') || joined.includes('nome') || joined.includes('q 1') || joined.includes('options')) {
          dataStart = i + 1;
          break;
        }
      }

      const dataRows = rows.slice(dataStart).filter(r => r[1] && String(r[1]).trim());

      if (!dataRows.length) {
        msg('import-msg','⚠️ Nenhum dado de aluno encontrado na planilha.','a-warn');
        return;
      }

      const alunos = dataRows.map(row => parseAluno(row, importTurma));

      /* guarda as linhas originais para recalcular quando o gabarito mudar */
      try { localStorage.setItem(K('raw' + importTurma), JSON.stringify(dataRows)); } catch (e) {}

      if (importTurma === 'A') {
        resultadosA = alunos;
        localStorage.setItem(K('resultadosA'), JSON.stringify(alunos));
      } else {
        resultadosB = alunos;
        localStorage.setItem(K('resultadosB'), JSON.stringify(alunos));
      }


      // Salvar no Firebase
      if (db) {
        db.ref(FB(`resultados${importTurma}`)).set(alunos)
          .catch(err => console.warn('Firebase save:', err.message));
      }

      updateImportBadges();
      renderImportPreview(alunos, importTurma);
      msg('import-msg',`✅ ${alunos.length} alunos do 4°${importTurma} importados com sucesso!`,'a-ok');
      // reset file input
      document.getElementById('fileInput').value = '';

    } catch(err) {
      msg('import-msg','❌ Erro ao processar: '+err.message,'a-err');
    }
  };
  reader.readAsBinaryString(file);
}

function parseAluno(row, turma) {
  // Formato: [Núm, Nome, Q1, Q2, ..., Q44]
  // col 0 = número, col 1 = nome, col 2..45 = Q1..Q44
  const numero = String(row[0] || '').trim();
  const nome   = String(row[1] || '').trim();
  const respostas = {};
  let acPort = 0, acMath = 0;

  for (let q = 1; q <= NQ; q++) {
    const respAluno = String(row[q + 1] || '').trim().toUpperCase();
    const gabQ = gabarito[`q${q}`] || {};
    const correta = (gabQ.resp || '').toUpperCase();
    const nula = gabQ.nula === true || correta === 'NULA';
    /* questão anulada: o ponto é concedido a todos os alunos */
    const acertou = nula ? true : (correta !== '' && respAluno === correta);
    respostas[`q${q}`] = { respAluno, correta, nula, acertou, desc: gabQ.desc || '', area: gabQ.area || '' };
    if (q <= PA) { if (acertou) acPort++; }
    else         { if (acertou) acMath++; }
  }

  const total = acPort + acMath;
  return {
    numero, nome, turma,
    respostas,
    acPort, acMath, total,
    pctPort:  pct(acPort, PA),
    pctMath:  pct(acMath, PA),
    pctGeral: pct(total, NQ),
  };
}

function recalcAll() {
  // Re-processar alunos já importados com novo gabarito
  ['A','B'].forEach(t => {
    const raw = localStorage.getItem(K('raw'+t));
    if (!raw) return;
    const rows = JSON.parse(raw);
    const alunos = rows.map(r => parseAluno(r, t));
    if (t==='A') resultadosA = alunos; else resultadosB = alunos;
    localStorage.setItem(K('resultados'+t), JSON.stringify(alunos));
    if (db) db.ref(FB('resultados'+t)).set(alunos).catch(()=>{});
  });
}

function clearTurma(t) {
  if (!confirm(`Apagar dados do 4°${t}?`)) return;
  if (t==='A') resultadosA = [];
  else resultadosB = [];
  localStorage.removeItem(K('resultados'+t));
  localStorage.removeItem(K('raw'+t));
  if (db) db.ref(FB('resultados'+t)).remove().catch(()=>{});
  updateImportBadges();
  msg('import-msg',`🗑️ Dados do 4°${t} removidos.`,'a-info');
}

function updateImportBadges() {
  const ca = resultadosA.length, cb = resultadosB.length;
  document.getElementById('cnt-a').textContent = ca ? `${ca} alunos` : 'não importado';
  document.getElementById('cnt-b').textContent = cb ? `${cb} alunos` : 'não importado';
  document.getElementById('dot-a').className = 'dot ' + (ca ? 'dot-ok' : 'dot-no');
  document.getElementById('dot-b').className = 'dot ' + (cb ? 'dot-ok' : 'dot-no');
  document.getElementById('clear-a').style.display = ca ? 'inline-flex' : 'none';
  document.getElementById('clear-b').style.display = cb ? 'inline-flex' : 'none';
}

function renderImportPreview(alunos, turma) {
  const avg = a => a.length ? Math.round(a.reduce((s,x)=>s+x,0)/a.length) : 0;
  const base = alunosMedia(alunos);   // exclui alunos PCD do cálculo das médias
  const avgPort  = avg(base.map(a=>a.pctPort));
  const avgMath  = avg(base.map(a=>a.pctMath));
  const avgGeral = avg(base.map(a=>a.pctGeral));

  document.getElementById('import-preview').innerHTML = `
    <div class="g3 fade">
      <div class="stat"><div class="val">${alunos.length}</div><div class="lbl">Alunos importados</div></div>
      <div class="stat"><div class="val">${avgPort}%</div><div class="lbl">Média Português</div></div>
      <div class="stat"><div class="val">${avgMath}%</div><div class="lbl">Média Matemática</div></div>
    </div>
    <div class="alert a-ok mt2">✅ 4°${turma} importado. Veja os resultados nas abas <strong>Dashboard</strong>, <strong>Ranking</strong> e <strong>Descritores</strong>.</div>`;
}

/* ═══════════════════════════════ DASHBOARD ═══════════════════════════════ */
function getFiltered(t) {
  if (t==='A')   return resultadosA;
  if (t==='B')   return resultadosB;
  return [...resultadosA, ...resultadosB];
}

function renderDashboard() {
  const all = getFiltered('ALL');
  if (!all.length) {
    document.getElementById('dash-empty').style.display = 'block';
    document.getElementById('dash-content').style.display = 'none';
    return;
  }
  document.getElementById('dash-empty').style.display = 'none';
  document.getElementById('dash-content').style.display = 'block';

  renderDashTurma('a', resultadosA);
  renderDashTurma('b', resultadosB);
  chartComp();
}

function renderDashTurma(t, arr) {
  const m = alunosMedia(arr);   // médias/estatísticas sem os alunos PCD
  const avg = fn => m.length ? Math.round(m.reduce((s,a) => s + fn(a), 0) / m.length) : 0;
  document.getElementById(`dk-${t}-alunos`).textContent = arr.length || '–';
  document.getElementById(`dk-${t}-geral`).textContent  = m.length ? avg(a=>a.pctGeral)+'%'  : '–';
  document.getElementById(`dk-${t}-port`).textContent   = m.length ? avg(a=>a.pctPort)+'%'   : '–';
  document.getElementById(`dk-${t}-math`).textContent   = m.length ? avg(a=>a.pctMath)+'%'   : '–';
  if (!m.length) return;
  const T = t.toUpperCase();
  chartDist(m, 'cDist'+T);
  chartArea(m, 'cArea'+T);
  chartQuest(m, 'cQuest'+T);
}

function chartDist(arr, id='cDist') {
  const b = [0,0,0,0,0];
  arr.forEach(a => {
    const p = a.pctGeral;
    if(p<=20)b[0]++; else if(p<=40)b[1]++; else if(p<=60)b[2]++; else if(p<=80)b[3]++; else b[4]++;
  });
  mkChart(id,'bar',{
    labels:['0–20%','21–40%','41–60%','61–80%','81–100%'],
    datasets:[{label:'Alunos',data:b,backgroundColor:['#f87171','#fb923c','#facc15','#4ade80','#22d3ee'],borderRadius:6}]
  },{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}});
}

function chartComp() {
  const avgF = (arr,fn) => arr.length ? Math.round(arr.reduce((s,a)=>s+fn(a),0)/arr.length) : 0;
  mkChart('cComp','bar',{
    labels:['Português','Matemática','Geral'],
    datasets:[
      {label:'4° A',data:[avgF(alunosMedia(resultadosA),a=>a.pctPort),avgF(alunosMedia(resultadosA),a=>a.pctMath),avgF(alunosMedia(resultadosA),a=>a.pctGeral)],backgroundColor:'#60a5fa',borderRadius:6},
      {label:'4° B',data:[avgF(alunosMedia(resultadosB),a=>a.pctPort),avgF(alunosMedia(resultadosB),a=>a.pctMath),avgF(alunosMedia(resultadosB),a=>a.pctGeral)],backgroundColor:'#a78bfa',borderRadius:6},
    ]
  },{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'}}}});
}

function chartArea(arr, id='cArea') {
  const avg = fn => arr.length ? Math.round(arr.reduce((s,a)=>s+fn(a),0)/arr.length) : 0;
  mkChart(id,'doughnut',{
    labels:['Português','Matemática'],
    datasets:[{data:[avg(a=>a.pctPort),avg(a=>a.pctMath)],backgroundColor:['#38bdf8','#a78bfa'],borderWidth:2}]
  },{responsive:true,maintainAspectRatio:false,plugins:{tooltip:{callbacks:{label:c=>c.label+': '+c.raw+'%'}}}});
}

function chartQuest(arr, id='cQuest') {
  const labels=[], data=[];
  for (let q=1;q<=NQ;q++) {
    labels.push('Q'+q);
    const ac = arr.filter(a=>a.respostas[`q${q}`]?.acertou).length;
    data.push(arr.length ? Math.round(ac/arr.length*100) : 0);
  }
  mkChart(id,'line',{
    labels,
    datasets:[{label:'% acerto',data,borderColor:'#6366f1',backgroundColor:'rgba(99,102,241,.12)',fill:true,tension:.35,pointRadius:2}]
  },{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'}}},plugins:{legend:{display:false}}});
}

function tblAlunos(arr) {
  const sorted = [...arr].sort((a,b)=>b.pctGeral-a.pctGeral);
  let h = `<table><thead><tr><th>#</th><th>Nº</th><th>Nome</th><th>Turma</th><th>Port. %</th><th>Nível Port.</th><th>Mat. %</th><th>Nível Mat.</th><th>Geral</th></tr></thead><tbody>`;

async function downloadGabaritoVisualPDF(turma, area) {
  const arr = turma === 'A' ? resultadosA : resultadosB;
  if (!arr.length) { alert('Importe os dados da turma antes de gerar o PDF.'); return; }

  const [from, to]  = area === 'port' ? [1, PA] : [PA + 1, NQ];
  const nivelFn     = area === 'port' ? nivelPort : nivelMath;
  const acKey       = area === 'port' ? 'acPort'  : 'acMath';
  const pctKey      = area === 'port' ? 'pctPort' : 'pctMath';
  const areaLabel   = area === 'port' ? 'Língua Portuguesa' : 'Matemática';
  const hdrColor    = area === 'port' ? '#0284c7' : '#7c3aed';
  const sorted      = [...arr].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));

  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;top:0;left:-9999px;background:#fff;font-family:Segoe UI,system-ui,sans-serif;padding:20px';
  document.body.appendChild(wrap);

  /* header */
  const hdr = document.createElement('div');
  hdr.style.cssText = `display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:3px solid ${hdrColor}`;
  hdr.innerHTML = `
    <div>
      <div style="font-size:1rem;font-weight:800;color:#1e2a3b">Gabarito Visual — ${areaLabel}</div>
      <div style="font-size:.74rem;color:#6b7a99;margin-top:2px">4° Ano ${turma} · ordenado alfabeticamente · ${new Date().toLocaleDateString('pt-BR')}</div>
    </div>`;
  wrap.appendChild(hdr);

  /* table — 100% inline styles so html2canvas captures colours */
  const COLS = { bg: { ok:'#16a34a', err:'#dc2626', blank:'#ffffff' }, fg: { ok:'#ffffff', err:'#ffffff', blank:'#d1d5db' } };
  const LVL  = { ADEQUADO:{bg:'#166534',fg:'#fff'}, INTERMEDIÁRIO:{bg:'#4ade80',fg:'#14532d'}, CRÍTICO:{bg:'#f59e0b',fg:'#78350f'}, 'MUITO CRÍTICO':{bg:'#dc2626',fg:'#fff'} };
  const th   = (txt, extra='') => `<th style="background:#1e2a3b;color:#fff;padding:.35rem .3rem;text-align:center;font-weight:700;font-size:.68rem;border:1px solid #374151;white-space:nowrap${extra}">${txt}</th>`;
  const td   = (txt, bg, fg, extra='') => `<td style="padding:.3rem .28rem;text-align:center;border:1px solid #e5e7eb;background:${bg};color:${fg};font-weight:700;font-size:.7rem${extra}">${txt}</td>`;

  /* gabarito oficial row — primeira linha do thead */
  let gabThead = `<tr>
    ${th('–',';width:26px;background:#1e2a3b;color:#9ca3af')}
    <th style="background:#1e2a3b;color:#fff;padding:.35rem .55rem;text-align:left;font-weight:800;font-size:.7rem;border:1px solid #374151;min-width:170px">GABARITO OFICIAL</th>`;
  for (let q = from; q <= to; q++) {
    const gab = gabarito[`q${q}`];
    const resp = gabLabel(gab);
    gabThead += `<th style="background:#1e2a3b;color:#fbbf24;padding:.35rem .3rem;text-align:center;font-weight:800;font-size:.7rem;border:1px solid #374151;width:22px">${resp}</th>`;
  }
  gabThead += `${th('–',';min-width:52px;background:#1e2a3b;color:#9ca3af')}${th('–',';min-width:90px;background:#1e2a3b;color:#9ca3af')}${th('–',';min-width:110px;background:#1e2a3b;color:#9ca3af')}</tr>`;

  /* descritor row — segunda linha do thead */
  let descThead = `<tr>
    ${th('–',';width:26px;background:#f0f4ff;color:#9ca3af')}
    <th style="background:#f0f4ff;color:#4b5563;padding:.35rem .55rem;text-align:left;font-weight:800;font-size:.7rem;border:1px solid #dde3ef;min-width:170px">DESCRITOR</th>`;
  for (let q = from; q <= to; q++) {
    const gab = gabarito[`q${q}`];
    const desc = gab && gab.desc ? gab.desc : '–';
    descThead += `<th style="background:#f0f4ff;color:#374151;padding:.35rem .28rem;text-align:center;font-weight:700;font-size:.62rem;border:1px solid #dde3ef;white-space:nowrap;width:22px">${desc}</th>`;
  }
  descThead += `${th('–',';min-width:52px;background:#f0f4ff;color:#9ca3af')}${th('–',';min-width:90px;background:#f0f4ff;color:#9ca3af')}${th('–',';min-width:110px;background:#f0f4ff;color:#9ca3af')}</tr>`;

  /* header row com NOME DO ALUNO — terceira linha do thead */
  let tbl = `<table style="border-collapse:collapse;font-size:.7rem;font-family:Segoe UI,system-ui,sans-serif;width:100%"><thead>
  ${gabThead}
  ${descThead}
  <tr>
    ${th('Nº',';width:26px')}
    ${th('NOME DO(A) ALUNO(A)',';text-align:left;padding-left:.6rem;min-width:170px')}`;
  for (let q = from; q <= to; q++) tbl += th(q, ';width:22px');
  tbl += `${th('TOTAL',';min-width:52px')}${th('RESULTADO',';min-width:90px')}${th('SITUAÇÃO',';min-width:110px')}</tr></thead><tbody>`;

  sorted.forEach((a, i) => {
    const rowBg = i % 2 === 0 ? '#ffffff' : '#f8fafd';
    const nv = nivelFn(a[pctKey]);
    const lv = LVL[nv.label] || { bg:'#eee', fg:'#000' };
    tbl += `<tr>
      ${td(i+1, rowBg, '#6b7a99')}
      <td style="padding:.3rem .55rem;text-align:left;border:1px solid #e5e7eb;background:${rowBg};font-weight:600;font-size:.7rem;border-right:2px solid #d1d5db">${esc(a.nome)}${isPcd(a) ? ' <span style="background:#ede9fe;color:#7c3aed;border-radius:3px;padding:0 3px;font-size:.6rem;font-weight:800">PCD</span>' : ''}</td>`;
    for (let q = from; q <= to; q++) {
      const r = a.respostas[`q${q}`];
      if (!r || !r.respAluno) {
        tbl += td('', '#fff', '#d1d5db');
      } else if (r.acertou) {
        tbl += td(r.respAluno, '#16a34a', '#fff');
      } else {
        tbl += td(r.respAluno, '#dc2626', '#fff');
      }
    }
    const pctBadge = `<span style="display:inline-block;padding:.18rem .45rem;border-radius:4px;font-size:.66rem;font-weight:800;background:${lv.bg};color:${lv.fg}">${a[pctKey]}%</span>`;
    const sitBadge = `<span style="display:inline-block;padding:.18rem .45rem;border-radius:4px;font-size:.66rem;font-weight:800;background:${lv.bg};color:${lv.fg};white-space:nowrap">${nv.label}</span>`;
    tbl += `
      ${td(`${a[acKey]}/${PA}`, '#eff4ff', '#1a56db', ';font-weight:800')}
      <td style="padding:.3rem .35rem;text-align:center;border:1px solid #e5e7eb;background:${rowBg}">${pctBadge}</td>
      <td style="padding:.3rem .35rem;text-align:center;border:1px solid #e5e7eb;background:${rowBg}">${sitBadge}</td>
    </tr>`;
  });
  tbl += '</tbody></table>';
  const tblDiv = document.createElement('div');
  tblDiv.innerHTML = tbl;
  wrap.appendChild(tblDiv);

  try {
    const canvas = await html2canvas(wrap, { scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff' });
    document.body.removeChild(wrap);

    const { jsPDF } = window.jspdf;
    const pdf     = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const margin  = 10;
    const pw      = pdf.internal.pageSize.getWidth();
    const ph      = pdf.internal.pageSize.getHeight();
    const usableW = pw - margin * 2;
    const scale   = usableW / canvas.width;
    const pageHpx = (ph - margin * 2) / scale;

    let srcY = 0, page = 0;
    while (srcY < canvas.height) {
      const sliceH = Math.min(pageHpx, canvas.height - srcY);
      const slice  = document.createElement('canvas');
      slice.width  = canvas.width;
      slice.height = Math.ceil(sliceH);
      slice.getContext('2d').drawImage(canvas, 0, srcY, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
      if (page > 0) pdf.addPage();
      pdf.addImage(slice.toDataURL('image/png'), 'PNG', margin, margin, usableW, sliceH * scale);
      srcY += sliceH;
      page++;
    }
    pdf.save(`gabarito_visual_5ano${turma}_${area}.pdf`);
  } catch(e) {
    if (document.body.contains(wrap)) document.body.removeChild(wrap);
    alert('Erro ao gerar PDF: ' + e.message);
  }
}

function levelClass(nv) {
  if (nv.label === 'ADEQUADO')      return 'score-adequado';

}

/* builds ranking table HTML using fully-inline colour styles
   so the output looks identical on screen AND inside html2canvas */
function rankingTableHTML(sorted, nivelFn, pctKey, acKey) {
  let h = `<table class="rank-table"><tbody>`;
  sorted.forEach((a, i) => {

function renderDescArea(areaKey, data, range) {
  const descs = {};
  for (let q = range[0]; q <= range[1]; q++) {
    const gabQ = gabarito[`q${q}`] || {};
    const desc = gabQ.desc || 'S/D';
    if (!descs[desc]) descs[desc] = { label: desc, questoes: [], ac: 0, total: 0 };
    descs[desc].questoes.push(q);
    data.forEach(a => {
      const r = a.respostas[`q${q}`];
      if (r) { descs[desc].total++; if (r.acertou) descs[desc].ac++; }
    });
  }

  const sorted = Object.values(descs).sort((a,b) => a.label.localeCompare(b.label));
  const pcts = sorted.map(d => d.total ? Math.round(d.ac/d.total*100) : 0);
  const colors = pcts.map(p => p>=70?'#4ade80':p>=50?'#facc15':'#f87171');

  mkChart('cDesc'+areaKey,'bar',{
    labels: sorted.map(d=>d.label),
    datasets:[{label:'% acerto',data:pcts,backgroundColor:colors,borderRadius:6}]
  },{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'}}},plugins:{legend:{display:false}}});

  let h = `<table><thead><tr><th>Descritor</th><th>Questões</th><th>Acertos</th><th>Respostas</th><th>% Acerto</th><th>Barra</th></tr></thead><tbody>`;
  sorted.forEach((d,i) => {
    const p=pcts[i], bc=p>=70?'':p>=50?'warn':'bad';
    h+=`<tr>
      <td><strong>${esc(d.label)}</strong></td>
      <td class="muted">${d.questoes.join(', ')}</td>
      <td>${d.ac}</td>
      <td>${d.total}</td>
      <td><strong>${p}%</strong></td>
      <td style="min-width:90px"><div class="pg-wrap"><div class="pg-bar ${bc}" style="width:${p}%"></div></div></td>
    </tr>`;
  });
  h += '</tbody></table>';
  document.getElementById('tbl-desc-'+areaKey.toLowerCase()).innerHTML = h;
}

/* ═══════════════════════════════ UTIL: pontos de corte seguros para o PDF ═══════════════════════════════
   Retorna Y (em px do canvas do html2canvas) onde é seguro fatiar,
   evitando dividir uma linha da tabela (ou bloco) no meio.                     */
function collectSafeCutPoints(wrap, canvasScale) {
  const wrapTop = wrap.getBoundingClientRect().top;
  const points  = new Set();
  points.add(0);
  /* linhas das tabelas — principal fonte de corte */
  wrap.querySelectorAll('tr').forEach(tr => {
    const r = tr.getBoundingClientRect();
    points.add(Math.round((r.bottom - wrapTop) * canvasScale));
  });
  /* filhos diretos do wrap (header, gráficos, cards) */
  Array.from(wrap.children).forEach(el => {
    const r = el.getBoundingClientRect();
    points.add(Math.round((r.bottom - wrapTop) * canvasScale));
  });
  return [...points].sort((a, b) => a - b);
}

/* Fatia o canvas respeitando os pontos de corte, adiciona páginas ao PDF */
function paginateCanvasToPDF(pdf, canvas, cutPoints, margin, usableW, pageHpx, scale) {
  let srcY = 0, page = 0;
  while (srcY < canvas.height) {
    let sliceH;
    const remain = canvas.height - srcY;
    if (remain <= pageHpx) {
      sliceH = remain;
    } else {
      const limit = srcY + pageHpx;
      let best = -1;
      for (const p of cutPoints) {
        if (p > srcY && p <= limit) best = p;
        else if (p > limit) break;
      }
      sliceH = (best > srcY) ? (best - srcY) : pageHpx;
    }
    const slice = document.createElement('canvas');
    slice.width  = canvas.width;
    slice.height = Math.ceil(sliceH);
    slice.getContext('2d').drawImage(canvas, 0, srcY, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
    if (page > 0) pdf.addPage();
    pdf.addImage(slice.toDataURL('image/png'), 'PNG', margin, margin, usableW, sliceH * scale);
    srcY += sliceH;
    page++;
  }
}

  });
  table.querySelectorAll('.rk-num').forEach(el => {
    el.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#f1f5fb;color:#6b7a99;font-weight:700;font-size:.78rem';
  });

  table.querySelectorAll('.rk-sub').forEach(el => { el.style.cssText = 'font-size:.72rem;color:#6b7a99'; });

  const totalAcPdf    = mArrPdf.reduce((sum, a) => sum + a[acKey], 0);
  const avgAcFloatPdf = mArrPdf.length ? totalAcPdf / mArrPdf.length : 0;
  const avgAcStrPdf   = (avgAcFloatPdf % 1 === 0) ? String(avgAcFloatPdf) : avgAcFloatPdf.toFixed(1);
  const avgPctPdf     = Math.round(avgAcFloatPdf / PA * 100);
  const avgNivelPdf   = nivelFn(avgPctPdf);
  const avgCPdf       = LEVEL_COLORS[avgNivelPdf.label] || { bg: '#eee', fg: '#000' };

      <div style="text-align:center;min-width:72px">
        <div style="font-size:2.2rem;font-weight:900;color:${avgCPdf.fg};line-height:1;letter-spacing:-1px">${avgPctPdf}%</div>
        <div style="font-size:.68rem;font-weight:700;color:${avgCPdf.fg};opacity:.75;margin-top:3px">${avgAcStrPdf} / ${PA} acertos</div>
      </div>
      <div style="width:1.5px;height:48px;background:${avgCPdf.fg};opacity:.2;border-radius:2px;flex-shrink:0"></div>
      <div style="flex:1">
        <div style="font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:${avgCPdf.fg};opacity:.65;margin-bottom:6px">Média da Turma · ${mArrPdf.length} alunos${arr.length !== mArrPdf.length ? ` (${arr.length - mArrPdf.length} PCD fora da média)` : ''}</div>
        <span style="display:inline-block;padding:4px 12px;border-radius:5px;font-size:.74rem;font-weight:800;letter-spacing:.5px;background:rgba(255,255,255,.22);color:${avgCPdf.fg};border:1.5px solid rgba(255,255,255,.35)">${avgNivelPdf.label}</span>
      </div>
    </div>
    <div style="background:#e5e7eb;height:7px"><div style="height:7px;background:${avgCPdf.bg};width:${avgPctPdf}%"></div></div>`;
  wrap.appendChild(avgDivPdf);

  try {
    const canvas = await html2canvas(wrap, { scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff' });
    /* coleta pontos seguros ANTES de remover o wrap do DOM */
    const canvasScale = canvas.width / wrap.getBoundingClientRect().width;
    const cutPoints   = collectSafeCutPoints(wrap, canvasScale);
    document.body.removeChild(wrap);

    const { jsPDF } = window.jspdf;
    const pdf     = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const margin  = 12;
    const pw      = pdf.internal.pageSize.getWidth();
    const ph      = pdf.internal.pageSize.getHeight();
    const usableW = pw - margin * 2;
    const scale   = usableW / canvas.width;           // px → mm
    const pageHpx = (ph - margin * 2) / scale;        // max canvas-px per page

    paginateCanvasToPDF(pdf, canvas, cutPoints, margin, usableW, pageHpx, scale);

    pdf.save(`ranking_5ano${turma}_${subject}.pdf`);
  } catch (e) {
    if (document.body.contains(wrap)) document.body.removeChild(wrap);
    alert('Erro ao gerar PDF: ' + e.message);
  }
}

        <div style="font-weight:700;font-size:.94rem;color:#1e2a3b">${esc(nomeExib(a))}</div>
        ${a.numero ? `<div style="font-size:.68rem;color:#6b7a99;margin-top:2px">Nº ${esc(a.numero)}</div>` : ''}
      </td>

        <div style="${subHdr}">📚 Português</div>

        <div style="${subHdr}">🔢 Matemática</div>
        <div style="display:flex;align-items:center;gap:.45rem">

      </td>

        <div style="font-size:1.18rem;font-weight:900;color:#1e2a3b">${a.pctGeral}%</div>
      </td>

  const tblDiv = document.createElement('div');
  tblDiv.innerHTML = `<table style="border-collapse:collapse;width:100%;font-family:Segoe UI,system-ui,sans-serif">${rowsHtml}</table>`;
  wrap.appendChild(tblDiv);

  try {
    const canvas = await html2canvas(wrap, { scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff' });
    const canvasScale = canvas.width / wrap.getBoundingClientRect().width;
    const cutPoints   = collectSafeCutPoints(wrap, canvasScale);
    document.body.removeChild(wrap);

    const { jsPDF } = window.jspdf;
    const pdf     = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const margin  = 12;
    const pw      = pdf.internal.pageSize.getWidth();
    const ph      = pdf.internal.pageSize.getHeight();
    const usableW = pw - margin * 2;
